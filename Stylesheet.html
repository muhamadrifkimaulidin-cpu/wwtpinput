<style>
/* ============================================
   CSS — WWTP Operations System v4.0
   Premium Dark/Light Theme, Mobile-First
   ============================================ */
:root, [data-theme="dark"] {
  --bg-primary: #0D0F14; --bg-secondary: #151821; --bg-card: #1C1F2A; --bg-input: #12141C; --bg-elevated: #242736;
  --border: rgba(255,255,255,0.08); --border-focus: #4ADE80;
  --text-primary: #F4F7FB; --text-secondary: #B0B9CC; --text-muted: #7F899E;
  --accent: #4ADE80; --accent-soft: rgba(74,222,128,0.12); --accent-glow: rgba(74,222,128,0.2);
  --cyan: #4ADE80; --gold: #FACC15; --gold-soft: rgba(250,204,21,0.12);
  --success: #4ADE80; --warning: #FACC15; --danger: #F87171; --danger-soft: rgba(248,113,113,0.1);
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
  --header-h: 56px; --nav-h: 68px; --safe-bottom: env(safe-area-inset-bottom, 0px);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.3); --shadow-nav: 0 -4px 20px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg-primary: #F4F5F7; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF; --bg-input: #F0F1F3; --bg-elevated: #F8F9FA;
  --border: rgba(0,0,0,0.10); --border-focus: #16A34A;
  --text-primary: #141720; --text-secondary: #3D4654; --text-muted: #5E6677;
  --accent: #16A34A; --accent-soft: rgba(22,163,74,0.08); --accent-glow: rgba(22,163,74,0.12);
  --cyan: #16A34A; --gold: #CA8A04; --gold-soft: rgba(202,138,4,0.08);
  --success: #16A34A; --warning: #CA8A04; --danger: #DC2626; --danger-soft: rgba(220,38,38,0.06);
  --shadow-card: 0 1px 8px rgba(0,0,0,0.06); --shadow-nav: 0 -2px 12px rgba(0,0,0,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; }
body { font-family:'IBM Plex Sans',-apple-system,sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent; transition:background 0.3s,color 0.3s; }
.screen { display:none; min-height:100vh; }
.screen.active { display:flex; flex-direction:column; }

/* LOGIN */
.login-container { flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:400px; margin:0 auto; width:100%; }
.login-logo { text-align:center; margin-bottom:48px; }
.logo-icon { font-size:60px; color:var(--accent); filter:drop-shadow(0 0 24px var(--accent-glow)); }
.login-logo h1 { font-family:'IBM Plex Mono',monospace; font-size:2rem; color:var(--text-primary); margin-top:12px; letter-spacing:4px; font-weight:700; }
.login-subtitle { color:var(--text-muted); font-size:0.85rem; margin-top:6px; }
.login-form { display:flex; flex-direction:column; gap:14px; }
.input-group { position:relative; display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; transition:border-color 0.2s,box-shadow 0.2s; }
.input-group:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.input-icon { color:var(--text-muted); font-size:20px; padding:0 14px; }
.input-group input { flex:1; background:transparent; border:none; color:var(--text-primary); padding:14px 14px 14px 0; font-size:0.95rem; outline:none; }
.input-group input::placeholder { color:var(--text-muted); }
.error-text { color:var(--danger); font-size:0.9rem; margin-top:4px; min-height:1em; }

/* BUTTONS */
.btn-primary { background:var(--accent); color:#0D0F14; border:none; padding:14px 24px; border-radius:var(--radius-sm); font-weight:600; font-size:0.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.2s; }
.btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }
.btn-primary:active { transform:scale(0.98); }
.btn-full { width:100%; }
.btn-secondary { background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border); padding:10px 20px; border-radius:var(--radius-sm); font-weight:500; font-size:0.88rem; cursor:pointer; transition:all 0.2s; }
.btn-secondary:hover { background:var(--bg-card); border-color:var(--text-muted); }
.btn-danger { background:var(--danger); color:#fff; border:none; padding:10px 20px; border-radius:var(--radius-sm); font-weight:600; font-size:0.88rem; cursor:pointer; }
.btn-icon { background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:8px; border-radius:50%; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.btn-icon:hover { color:var(--text-primary); background:var(--accent-soft); }
.btn-sm { padding:8px 12px; border-radius:var(--radius-xs); font-size:0.9rem; cursor:pointer; border:none; display:flex; align-items:center; gap:4px; }
.btn-accent { background:var(--accent); color:#0D0F14; font-weight:600; }
.btn-submit-top { background:var(--accent); color:#0D0F14; border:none; padding:10px 20px; border-radius:var(--radius-sm); font-weight:700; font-size:0.88rem; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:all 0.2s; }
.btn-submit-top:hover { filter:brightness(1.1); }
.btn-submit-top:active { transform:scale(0.97); }

/* HEADER */
.app-header { position:sticky; top:0; z-index:100; background:var(--bg-secondary); border-bottom:1px solid var(--border); height:var(--header-h); display:flex; align-items:center; padding:0 16px; justify-content:space-between; backdrop-filter:blur(12px); transition:background 0.3s; }
.header-left { display:flex; align-items:center; gap:10px; }
.header-icon { font-size:26px; color:var(--accent); }
.header-title { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.05rem; letter-spacing:2px; color:var(--text-primary); }
.header-right { display:flex; align-items:center; gap:4px; }
.header-user { font-size:0.87rem; color:var(--text-secondary); font-weight:500; }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; background:var(--bg-secondary); border-top:1px solid var(--border); height:var(--nav-h); padding-bottom:var(--safe-bottom); display:flex; justify-content:space-around; align-items:center; box-shadow:var(--shadow-nav); transition:background 0.3s; }
.nav-btn { background:none; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:0.76rem; font-weight:500; cursor:pointer; padding:8px 16px; border-radius:var(--radius-sm); transition:all 0.2s; }
.nav-btn .material-icons-round { font-size:24px; transition:all 0.2s; }
.nav-btn.active { color:var(--accent); }
.nav-btn.active .material-icons-round { color:var(--accent); filter:drop-shadow(0 0 6px var(--accent-glow)); }

/* CONTENT */
.app-content { flex:1; padding:12px 14px calc(var(--nav-h)+80px+var(--safe-bottom)); max-width:600px; margin:0 auto; width:100%; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.input-subform { display:none; }
.input-subform.active { display:block; }
.fik-table th, .fik-table td { font-size:0.8rem; padding:4px 3px; min-width:60px; }
.fik-table th:first-child, .fik-table td:first-child { min-width:50px; position:sticky; left:0; background:var(--bg-card); z-index:1; font-weight:700; color:var(--accent); }
.fik-table input, .fik-table select { padding:7px 4px; font-size:0.82rem; min-width:55px; }
.page-header { margin-bottom:16px; padding:4px 0; display:flex; justify-content:space-between; align-items:center; }
.page-header h2 { font-size:1.25rem; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--text-primary); }
.page-header h2 .material-icons-round { color:var(--accent); font-size:22px; }

/* FORM */
.form-section { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow-card); transition:background 0.3s,border-color 0.3s; }
.section-title { display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.88rem; color:var(--accent); margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; }
.section-title .material-icons-round { font-size:18px; }
.form-row { margin-bottom:12px; }
.form-field { margin-bottom:10px; }
.form-field label { display:block; font-size:0.9rem; color:var(--text-secondary); margin-bottom:5px; font-weight:500; }
input[type="text"],input[type="number"],input[type="date"],select,textarea { width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); padding:11px 12px; border-radius:var(--radius-xs); font-size:0.92rem; outline:none; transition:all 0.2s; font-family:'IBM Plex Sans',sans-serif; }
input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
input::placeholder,textarea::placeholder { color:var(--text-muted); }
.readonly-field { opacity:0.6; }
.shift-toggle { display:flex; gap:6px; }
.shift-btn { flex:1; padding:10px 0; text-align:center; border:1px solid var(--border); background:var(--bg-input); color:var(--text-secondary); border-radius:var(--radius-xs); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
.shift-btn.active { background:var(--accent); color:#0D0F14; border-color:var(--accent); box-shadow:0 2px 10px var(--accent-glow); }
.checkbox-row { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; user-select:none; border-bottom:1px solid var(--border); }
.checkbox-row:last-child { border-bottom:none; }
.checkbox-row input[type="checkbox"] { display:none; }
.checkmark { width:22px; height:22px; border-radius:var(--radius-xs); border:2px solid var(--text-muted); display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
.checkbox-row input:checked+.checkmark { background:var(--accent); border-color:var(--accent); }
.checkbox-row input:checked+.checkmark::after { content:'✓'; color:#0D0F14; font-size:14px; font-weight:700; }
.chk-label { font-size:0.88rem; color:var(--text-primary); }
.checkbox-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
.table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.data-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
.data-table th { text-align:left; padding:8px 6px; color:var(--text-muted); font-weight:500; font-size:0.85rem; border-bottom:1px solid var(--border); }
.data-table td { padding:6px; vertical-align:middle; }
.data-table input { padding:9px 8px; font-size:0.88rem; }
.label-cell { font-weight:600; color:var(--accent); white-space:nowrap; font-size:0.9rem; }
.diff-value { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--accent); font-size:0.9rem; }
.fm-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fm-item label { display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:4px; font-weight:500; }
.fm-item input { padding:9px 8px; font-size:0.88rem; }
.chem-stack { display:flex; flex-direction:column; gap:10px; }
.chem-row { display:flex; align-items:center; gap:12px; }
.chem-row label { width:80px; font-size:0.85rem; color:var(--text-secondary); font-weight:500; flex-shrink:0; }
.input-with-unit { flex:1; display:flex; align-items:center; gap:0; }
.input-with-unit input { border-radius:var(--radius-xs) 0 0 var(--radius-xs); border-right:none; }
.unit-badge { background:var(--accent); color:#0D0F14; font-size:0.85rem; font-weight:700; padding:11px 12px; border-radius:0 var(--radius-xs) var(--radius-xs) 0; white-space:nowrap; }
.form-doodle { padding:20px 10px 0; opacity:0.8; }
.form-doodle svg { width:100%; height:auto; }

/* DASHBOARD */
.dash-filter { margin-bottom:14px; }
.filter-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.filter-field { flex:1; }
.filter-field label { display:block; font-size:0.9rem; color:var(--text-muted); margin-bottom:4px; }
.summary-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.summary-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow-card); transition:all 0.3s; position:relative; overflow:hidden; }
.summary-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:var(--radius) var(--radius) 0 0; }
.card-icon { font-size:28px; color:var(--accent); margin-bottom:6px; display:block; }
.card-value { font-family:'IBM Plex Mono',monospace; font-size:1.7rem; font-weight:700; color:var(--text-primary); }
.card-label { font-size:0.87rem; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
.dash-subtabs { display:flex; gap:6px; margin-bottom:14px; }
.subtab-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); font-size:0.92rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
.subtab-btn .material-icons-round { font-size:20px; }
.subtab-btn.active { background:var(--accent); color:#0D0F14; border-color:var(--accent); }
.dash-subcontent { display:none; }
.dash-subcontent.active { display:block; }
.chart-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow-card); transition:all 0.3s; }
.chart-card h3 { font-size:1.15rem; color:var(--text-primary); font-weight:700; margin-bottom:14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.chart-date-sub { font-size:0.9rem; font-weight:400; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; }
.chart-wrap { position:relative; height:280px; }
.chart-wrap canvas { width:100%!important; height:100%!important; }
.chart-wrap-tall { position:relative; height:320px; }
.chart-wrap-tall canvas { width:100%!important; height:100%!important; }
.chart-date-filter { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.chart-date-filter input[type="date"] { flex:1; padding:10px 12px; font-size:0.9rem; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-xs); color:var(--text-primary); }
.chart-date-filter input[type="date"]:focus { border-color:var(--accent); }
.chart-date-filter span { color:var(--text-muted); font-size:0.87rem; }
.chart-note { margin-top:12px; padding:12px 14px; border-radius:var(--radius-xs); background:var(--accent-soft); border-left:3px solid var(--accent); font-size:0.85rem; color:var(--text-secondary); line-height:1.6; }
.chart-note strong { color:var(--accent); }
.chart-note-warn { background:var(--gold-soft); border-left-color:var(--gold); }
.chart-note-warn strong { color:var(--gold); }

/* GROUP NAV */
.group-nav { display:flex; gap:6px; padding:0 0 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.group-nav::-webkit-scrollbar { display:none; }
.group-btn { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:12px 18px; border-radius:var(--radius-sm); background:var(--bg-card); border:1px solid var(--border); color:var(--text-secondary); font-size:0.88rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
.group-btn .material-icons-round { font-size:18px; }
.group-btn.active { background:var(--accent); color:#0D0F14; border-color:var(--accent); box-shadow:0 2px 10px var(--accent-glow); }
.pres-group { display:none; }
.pres-group.active { display:block; }
.group-header { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow-card); }
.group-header h3 { font-family:'IBM Plex Mono',monospace; font-size:1.1rem; color:var(--accent); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; }

/* DATABASE */
.db-controls { margin-bottom:14px; display:flex; flex-direction:column; gap:10px; }
.db-filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.db-filters select { width:auto; min-width:120px; flex-shrink:0; padding:10px 12px; }
.db-date-range { display:flex; align-items:center; gap:6px; flex:1; min-width:0; }
.db-date-range input[type="date"] { flex:1; min-width:0; padding:10px 8px; font-size:0.88rem; }
.db-date-sep { color:var(--text-muted); font-size:0.85rem; flex-shrink:0; }
.db-filters .btn-sm { flex-shrink:0; padding:10px 12px; }
.search-bar { display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px; transition:border-color 0.2s; }
.search-bar:focus-within { border-color:var(--accent); }
.search-bar .material-icons-round { color:var(--text-muted); font-size:20px; }
.search-bar input { flex:1; background:transparent; border:none; color:var(--text-primary); padding:11px 0; font-size:0.9rem; outline:none; }
.records-list { display:flex; flex-direction:column; gap:10px; }
.record-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow-card); transition:all 0.2s; }
.record-card:active { transform:scale(0.99); }
.rc-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.rc-date { font-family:'IBM Plex Mono',monospace; font-size:0.85rem; font-weight:600; color:var(--text-primary); }
.rc-shift { display:flex; gap:4px; }
.rc-badge { font-size:0.85rem; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:0.3px; }
.rc-badge.s1 { background:var(--accent-soft); color:var(--accent); }
.rc-badge.s2 { background:var(--gold-soft); color:var(--gold); }
.rc-badge.s3 { background:rgba(167,139,250,0.12); color:#A78BFA; }
.rc-operator { font-size:0.9rem; color:var(--text-secondary); margin-bottom:8px; }
.rc-badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.rc-chem { font-size:0.85rem; color:var(--text-muted); }
.rc-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
.btn-view,.btn-edit,.btn-delete-card { padding:6px 14px; border-radius:var(--radius-xs); font-size:0.85rem; font-weight:600; cursor:pointer; border:none; transition:all 0.2s; display:flex; align-items:center; gap:4px; }
.btn-view { background:var(--accent-soft); color:var(--accent); }
.btn-edit { background:var(--gold-soft); color:var(--gold); }
.btn-delete-card { background:var(--danger-soft); color:var(--danger); }
.pagination { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:16px; padding-bottom:8px; }
.pagination button { padding:8px 14px; border-radius:var(--radius-xs); border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); font-size:0.9rem; cursor:pointer; font-weight:600; transition:all 0.2s; }
.pagination button.active { background:var(--accent); color:#0D0F14; border-color:var(--accent); }
.page-info { font-size:0.85rem; color:var(--text-muted); }
.loading-state { text-align:center; padding:40px 0; color:var(--text-muted); }
.empty-state { text-align:center; padding:40px 0; color:var(--text-muted); font-size:0.9rem; }

/* MODALS */
.modal-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); justify-content:center; align-items:flex-end; }
.modal-overlay.open { display:flex; }
.modal-container { background:var(--bg-secondary); border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:500px; max-height:85vh; display:flex; flex-direction:column; animation:slideUp 0.25s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-sm { max-width:380px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:1rem; display:flex; align-items:center; gap:8px; color:var(--text-primary); }
.modal-header-danger h3 { color:var(--danger); }
.modal-body { padding:16px 20px; overflow-y:auto; flex:1; }
.modal-footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }
.modal-btn-row { display:flex; gap:10px; justify-content:flex-end; }
.detail-section { margin-bottom:16px; }
.detail-section-title { font-size:0.9rem; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; padding-bottom:6px; margin-bottom:8px; border-bottom:1px solid var(--border); }
.detail-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--border); }
.detail-row:last-child { border-bottom:none; }
.detail-label { font-size:0.9rem; color:var(--text-secondary); }
.detail-value { font-size:0.85rem; font-weight:500; color:var(--text-primary); font-family:'IBM Plex Mono',monospace; }
.detail-text { font-size:0.85rem; color:var(--text-primary); line-height:1.5; white-space:pre-wrap; }
.delete-info { font-size:0.88rem; color:var(--text-secondary); line-height:1.5; }

/* TOAST */
