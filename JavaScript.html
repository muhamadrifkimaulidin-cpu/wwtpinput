<script>
/* ============================================
   JavaScript — WWTP Operations System
   App Logic, CRUD, Dashboard, Navigation
   FIXED: FM validation, fm_leaching edit, error handling
   ============================================ */

// ========== STATE ==========
var currentUser = null;
var currentPage = 1;
var editingRecordId = null;
var deletingRecordId = null;
var deletingRecordInfo = '';
var searchTimeout = null;
var charts = {};
var DB_DEFAULT_DAYS = 10;

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', function() {
  var saved = sessionStorage.getItem('wwtp_user');
  if (saved) { try { currentUser = JSON.parse(saved); showMainApp(); } catch(e) { showLoginScreen(); } }
  else { showLoginScreen(); }
});

// ========== AUTH ==========
var loginTimer_ = null, loginSeconds_ = 0;

function handleLogin() {
  var name = document.getElementById('loginName').value.trim();
  var pass = document.getElementById('loginPassword').value.trim();
  var errEl = document.getElementById('loginError'); errEl.textContent = '';
  if (!name || !pass) { errEl.textContent = 'Mohon isi nama dan password.'; return; }
  var btn = document.getElementById('btnLogin'); btn.disabled = true; loginSeconds_ = 0;
  updateLoginBtn_('Menghubungi server...');
  loginTimer_ = setInterval(function() {
    loginSeconds_++;
    if (loginSeconds_ <= 3) updateLoginBtn_('Menghubungi server...');
    else if (loginSeconds_ <= 8) updateLoginBtn_('Memverifikasi... (' + loginSeconds_ + 's)');
    else if (loginSeconds_ <= 15) updateLoginBtn_('Server lambat... (' + loginSeconds_ + 's)');
    else { clearInterval(loginTimer_); btn.disabled = false; btn.innerHTML = '<span class="material-icons-round">refresh</span> Coba Lagi'; errEl.textContent = 'Server tidak merespon. Klik Coba Lagi.'; }
  }, 1000);
  google.script.run
    .withSuccessHandler(function(res) {
      clearInterval(loginTimer_); btn.disabled = false; btn.innerHTML = '<span class="material-icons-round">login</span> Masuk';
      if (res && res.success) { currentUser = res.user; sessionStorage.setItem('wwtp_user', JSON.stringify(currentUser)); showMainApp(); }
      else { errEl.textContent = (res && res.message) || 'Login gagal.'; }
    })
    .withFailureHandler(function() { clearInterval(loginTimer_); btn.disabled = false; btn.innerHTML = '<span class="material-icons-round">refresh</span> Coba Lagi'; errEl.textContent = 'Koneksi gagal. Klik Coba Lagi.'; })
    .loginUser(name, pass);
}
function updateLoginBtn_(text) { document.getElementById('btnLogin').innerHTML = '<span class="material-icons-round">hourglass_top</span> ' + text; }
function handleLogout() { currentUser = null; sessionStorage.removeItem('wwtp_user'); showLoginScreen(); }
function showLoginScreen() { document.getElementById('loginScreen').classList.add('active'); document.getElementById('mainApp').classList.remove('active'); document.getElementById('loginName').value = ''; document.getElementById('loginPassword').value = ''; document.getElementById('loginError').textContent = ''; }
function isVisitor() { return currentUser && currentUser.role === 'visitor'; }

function showMainApp() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainApp').classList.add('active');
  document.getElementById('headerUserName').textContent = currentUser.nama;
  var sbu = document.getElementById('sidebarUserName'); if (sbu) sbu.textContent = currentUser.nama;
  var today = new Date().toISOString().split('T')[0];
  var hour = new Date().getHours();
  var shift = (hour >= 6 && hour < 14) ? 1 : (hour >= 14 && hour < 22) ? 2 : 3;
  document.getElementById('f_tanggal').value = today;
  document.getElementById('f_nama').value = currentUser.nama;
  selectShift(shift, true);
  if (isVisitor()) {
    var submitBtn = document.getElementById('btnSubmitTop'); if (submitBtn) submitBtn.style.display = 'none';
    document.querySelectorAll('#dataForm input, #dataForm textarea, #dataForm select, #dataForm button').forEach(function(el) { el.disabled = true; el.style.opacity = '0.5'; });
    switchTab('tabDashboard', document.querySelector('[data-tab="tabDashboard"]'));
  }
  setTimeout(function() { loadNotifBadge(); }, 500);
}

// ========== NAVIGATION ==========
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.sidebar-btn[data-tab]').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('[data-tab="'+tabId+'"]').forEach(function(b) { b.classList.add('active'); });
  if (tabId === 'tabDashboard') loadDashboard();
  if (tabId === 'tabDatabase') { initDbDateDefaults_(); loadRecords(1); }
}

// ========== DATABASE DATE DEFAULTS (10 hari) ==========
function initDbDateDefaults_() {
  var s = document.getElementById('db_filter_date_start');
  var e = document.getElementById('db_filter_date_end');
  if (!s.value && !e.value) {
    var today = new Date();
    var start = new Date(); start.setDate(today.getDate() - DB_DEFAULT_DAYS);
    s.value = start.toISOString().split('T')[0];
    e.value = today.toISOString().split('T')[0];
  }
}

// ========== INPUT FORM ==========
function selectShift(s, skipLoad) {
  document.querySelectorAll('#shiftToggle .shift-btn').forEach(function(b) { b.classList.toggle('active', parseInt(b.dataset.shift) === s); });
  if (!skipLoad) loadLastShiftData(s);
}

var _prevFM = null;
var FM_ALL = ['fm_softener_lt3','fm_flotation','fm_mg16','fm_pam','fm_pam_shift','fm_sm1','fm_sm2','fm_sm3','fm_sm4','fm_sm5','fm_sm6','fm_leaching'];
var FM_LABELS = {'fm_softener_lt3':'Softener lt.3','fm_flotation':'Flotation','fm_mg16':'MG 16','fm_pam':'PAM Awal','fm_pam_shift':'PAM/shift','fm_sm1':'Sm 1','fm_sm2':'Sm 2','fm_sm3':'Sm 3','fm_sm4':'Sm 4','fm_sm5':'Sm 5','fm_sm6':'Sm 6','fm_leaching':'FM Leaching'};

function loadLastShiftData(shift) {
  var tanggal = document.getElementById('f_tanggal').value; if (!tanggal) return;
  _prevFM = null;
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.success || !res.data) return;
    var d = res.data;
    if (d.clr_bak_sirkulasi) document.getElementById('f_clr_bak_sirkulasi_before').value = d.clr_bak_sirkulasi;
    if (d.clr_sungai) document.getElementById('f_clr_sungai_before').value = d.clr_sungai;
    if (d.clr_mg17_18) document.getElementById('f_clr_mg17_18_before').value = d.clr_mg17_18;
    ['bak_sirkulasi','sungai','mg17_18'].forEach(function(n) { calcDiff(n); });
    _prevFM = {};
    FM_ALL.forEach(function(key) { _prevFM[key] = parseFloat(d[key]) || 0; });
  }).withFailureHandler(function(){}).getLastShiftData(tanggal, shift);
}

function getSelectedShift() { var a = document.querySelector('#shiftToggle .shift-btn.active'); return a ? parseInt(a.dataset.shift) : 1; }

function calcDiff(name) {
  var before = parseFloat(document.getElementById('f_clr_' + name + '_before').value) || 0;
  var after = parseFloat(document.getElementById('f_clr_' + name + '_after').value) || 0;
  var diff = Math.round((after - before) * 100) / 100;
  var el = document.getElementById('diff_' + name);
  el.textContent = diff; el.style.color = diff < 0 ? '#F87171' : '#4ADE80';
}

function collectFormData() {
  return {
    tanggal: document.getElementById('f_tanggal').value, shift: getSelectedShift(),
    nama_operator: document.getElementById('f_nama').value, user_id: currentUser.user_id,
    chk_mg17_18: document.getElementById('f_chk_mg17_18').checked, chk_clarifier: document.getElementById('f_chk_clarifier').checked,
    chk_fe_removal: document.getElementById('f_chk_fe_removal').checked, chk_bak_sirkulasi_besar: document.getElementById('f_chk_bak_sirkulasi_besar').checked,
    clr_bak_sirkulasi_before: parseFloat(document.getElementById('f_clr_bak_sirkulasi_before').value)||0, clr_bak_sirkulasi_after: parseFloat(document.getElementById('f_clr_bak_sirkulasi_after').value)||0,
    clr_sungai_before: parseFloat(document.getElementById('f_clr_sungai_before').value)||0, clr_sungai_after: parseFloat(document.getElementById('f_clr_sungai_after').value)||0,
    clr_mg17_18_before: parseFloat(document.getElementById('f_clr_mg17_18_before').value)||0, clr_mg17_18_after: parseFloat(document.getElementById('f_clr_mg17_18_after').value)||0,
    fm_softener_lt3: parseFloat(document.getElementById('f_fm_softener_lt3').value)||0, fm_flotation: parseFloat(document.getElementById('f_fm_flotation').value)||0,
    fm_mg16: parseFloat(document.getElementById('f_fm_mg16').value)||0, fm_pam: parseFloat(document.getElementById('f_fm_pam').value)||0,
    fm_pam_shift: parseFloat(document.getElementById('f_fm_pam_shift').value)||0,
    fm_sm1: parseFloat(document.getElementById('f_fm_sm1').value)||0, fm_sm2: parseFloat(document.getElementById('f_fm_sm2').value)||0,
    fm_sm3: parseFloat(document.getElementById('f_fm_sm3').value)||0, fm_sm4: parseFloat(document.getElementById('f_fm_sm4').value)||0,
    fm_sm5: parseFloat(document.getElementById('f_fm_sm5').value)||0, fm_sm6: parseFloat(document.getElementById('f_fm_sm6').value)||0,
    fm_leaching: parseFloat(document.getElementById('f_fm_leaching').value)||0,
    filter_press_batch: document.getElementById('f_filter_press_batch').value, bongkar_lumpur: document.getElementById('f_bongkar_lumpur').value,
    lab_clarifier: document.getElementById('f_lab_clarifier').checked, lab_mg17_18: document.getElementById('f_lab_mg17_18').checked,
    lab_bak_sirkulasi: document.getElementById('f_lab_bak_sirkulasi').checked, lab_demin: document.getElementById('f_lab_demin').checked, lab_pam: document.getElementById('f_lab_pam').checked,
    lab_sm1: document.getElementById('f_lab_sm1').checked, lab_sm2: document.getElementById('f_lab_sm2').checked, lab_sm3: document.getElementById('f_lab_sm3').checked,
    lab_sm4: document.getElementById('f_lab_sm4').checked, lab_sm5: document.getElementById('f_lab_sm5').checked, lab_sm6: document.getElementById('f_lab_sm6').checked,
    lab_tanggal: document.getElementById('f_lab_tanggal').value || '',
    chem_hydrofloc_kg: parseFloat(document.getElementById('f_chem_hydrofloc_kg').value)||0, chem_polymer_g: parseFloat(document.getElementById('f_chem_polymer_g').value)||0,
    pekerjaan_tambahan: document.getElementById('f_pekerjaan_tambahan').value, catatan: document.getElementById('f_catatan').value
  };
}

// ===== FIX #1: FM validation changed from hard-block to confirm() dialog =====
function handleSubmit() {
  try {
    if (isVisitor()) { showToast('Akun Visitor hanya bisa melihat data.', 'error'); return; }
    var data = collectFormData();
    if (!data.tanggal) { showToast('Tanggal harus diisi!', 'error'); return; }

    // FIX: Empty FM → confirm dialog instead of hard block
    var emptyFM = [];
    FM_ALL.forEach(function(key) {
      var el = document.getElementById('f_' + key);
      if (!el) return;
      var val = el.value;
      if (val === '' || val === null || val === undefined) emptyFM.push(FM_LABELS[key]);
    });
    if (emptyFM.length > 0) {
      if (!confirm('Flow meter berikut belum diisi:\n• ' + emptyFM.join('\n• ') + '\n\nField kosong akan disimpan sebagai 0.\nLanjutkan simpan?')) {
        return;
      }
    }

    // FIX: FM comparison → confirm dialog instead of hard block, skip if curr is 0
    if (_prevFM) {
      var tooSmall = [], tooLarge = [];
      FM_ALL.forEach(function(key) {
        var prev = _prevFM[key] || 0;
        if (prev === 0) return;
        var curr = parseFloat(data[key]) || 0;
        if (curr > 0 && curr < prev) {
          tooSmall.push(FM_LABELS[key] + ' (' + curr + ' < prev ' + prev + ')');
        } else if (curr > 0 && (curr - prev) > 500) {
          tooLarge.push(FM_LABELS[key] + ' (selisih ' + Math.round(curr - prev) + ')');
        }
      });
      if (tooSmall.length > 0) {
        if (!confirm('FM lebih kecil dari shift sebelumnya:\n• ' + tooSmall.join('\n• ') + '\n\nApakah data ini benar? Lanjutkan simpan?')) {
          return;
        }
      }
      if (tooLarge.length > 0) {
        if (!confirm('Selisih FM terlalu besar (>500):\n• ' + tooLarge.join('\n• ') + '\n\nApakah data ini benar? Lanjutkan simpan?')) {
          return;
        }
      }
    }

    showLoading(true);
    google.script.run.withSuccessHandler(function(res) {
      showLoading(false);
      if (res && res.success) { showToast('Data berhasil disimpan! ' + res.record_id, 'success'); ssCacheClear_(); resetForm(); }
      else { showToast((res && res.message) || 'Gagal menyimpan.', 'error'); }
    }).withFailureHandler(function(err) {
      showLoading(false);
      showToast('Gagal: ' + (err && err.message ? err.message : 'koneksi error'), 'error');
    }).createRecord(data);
  } catch (e) {
    showLoading(false);
    showToast('Error submit: ' + e.message, 'error');
  }
}

function resetForm() {
  ['f_clr_bak_sirkulasi_before','f_clr_bak_sirkulasi_after','f_clr_sungai_before','f_clr_sungai_after','f_clr_mg17_18_before','f_clr_mg17_18_after','f_fm_softener_lt3','f_fm_flotation','f_fm_mg16','f_fm_pam','f_fm_pam_shift','f_fm_sm1','f_fm_sm2','f_fm_sm3','f_fm_sm4','f_fm_sm5','f_fm_sm6','f_fm_leaching','f_chem_hydrofloc_kg','f_chem_polymer_g'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f_filter_press_batch').value=''; document.getElementById('f_bongkar_lumpur').value='';
  document.getElementById('f_pekerjaan_tambahan').value=''; document.getElementById('f_catatan').value='';
  document.getElementById('f_lab_tanggal').value='';
  ['f_chk_mg17_18','f_chk_clarifier','f_chk_fe_removal','f_chk_bak_sirkulasi_besar','f_lab_clarifier','f_lab_mg17_18','f_lab_bak_sirkulasi','f_lab_demin','f_lab_pam','f_lab_sm1','f_lab_sm2','f_lab_sm3','f_lab_sm4','f_lab_sm5','f_lab_sm6'].forEach(function(id){document.getElementById(id).checked=false;});
  ['diff_bak_sirkulasi','diff_sungai','diff_mg17_18'].forEach(function(id){document.getElementById(id).textContent='0';document.getElementById(id).style.color='#4ADE80';});
  window.scrollTo({top:0,behavior:'smooth'});
}

// ========== SUB-FORM NAVIGATION ==========
var activeInputForm = 'formOps';

function switchInputForm(formId, btn) {
  document.querySelectorAll('.input-subform').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById(formId).classList.add('active');
  document.querySelectorAll('#inputFormNav .group-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  activeInputForm = formId;
  if (formId === 'formFIK') initFIKForm_();
  if (formId === 'formSoftener') initSoftenerForm_();
  if (formId === 'formMaintenance') initMaintenanceForm_();
  window.scrollTo({top:0,behavior:'smooth'});
}

function handleActiveSubmit() {
  try {
    if (isVisitor()) { showToast('Akun Visitor hanya bisa melihat data.', 'error'); return; }
    if (activeInputForm === 'formOps') handleSubmit();
    else if (activeInputForm === 'formFIK') handleSubmitFIK();
    else if (activeInputForm === 'formSoftener') handleSubmitSoftener();
    else if (activeInputForm === 'formMaintenance') handleSubmitMaintenance();
  } catch (e) {
    showLoading(false);
    showToast('Error: ' + e.message, 'error');
  }
}

// ========== FIK PROSES CLARIFIER ==========
var FIK_SHIFT_WAKTU = { 1: ['07','12'], 2: ['15','19'], 3: ['23','03'] };
var FIK_FIELDS = ['rotameter','flowmeter','stroke_naoh','stroke_hidroflok','stroke_superflok','ph','visual_flokulasi','visual_air','batch_lumpur'];

function initFIKForm_() {
  var today = new Date().toISOString().split('T')[0];
  var hour = new Date().getHours();
  var shift = (hour>=6&&hour<14)?1:(hour>=14&&hour<22)?2:3;
  document.getElementById('fik_tanggal').value = today;
  document.getElementById('fik_nama').value = currentUser.nama;
  selectFikShift(shift);
}
function selectFikShift(s) {
  document.querySelectorAll('#fikShiftToggle .shift-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.shift)===s);});
  buildFIKTable_(s);
}

function buildFIKTable_(shift) {
  var tbody = document.getElementById('fikTableBody'); if (!tbody) return;
  var waktu = FIK_SHIFT_WAKTU[shift] || ['07','12'];
  var h = '';
  waktu.forEach(function(w) {
    h += '<tr><td class="label-cell">' + w + ':00</td>';
    FIK_FIELDS.forEach(function(f) {
      var id = 'fik_p' + w + '_' + f;
      if (f === 'visual_flokulasi') {
        h += '<td><select id="'+id+'"><option value="">—</option><option>Baik</option><option>Cukup</option><option>Buruk</option></select></td>';
      } else if (f === 'visual_air') {
        h += '<td><select id="'+id+'"><option value="">—</option><option>Jernih</option><option>Keruh</option><option>Sangat Keruh</option></select></td>';
      } else {
        h += '<td><input type="'+(f==='batch_lumpur'?'text':'number')+'" id="'+id+'" inputmode="'+(f==='batch_lumpur'?'text':'decimal')+'" step="any"></td>';
      }
    });
    h += '</tr>';
  });
  tbody.innerHTML = h;
}

function collectFIKData() {
  var as = document.querySelector('#fikShiftToggle .shift-btn.active');
  var shift = as ? parseInt(as.dataset.shift) : 1;
  var data = {
    tanggal: document.getElementById('fik_tanggal').value,
    shift: shift,
    nama_operator: document.getElementById('fik_nama').value,
    user_id: currentUser.user_id,
    prep_naoh_flake_kg: parseFloat(document.getElementById('fik_prep_naoh_flake_kg').value)||0,
    prep_hidroflok_kg: parseFloat(document.getElementById('fik_prep_hidroflok_kg').value)||0,
    prep_superflok_g: parseFloat(document.getElementById('fik_prep_superflok_g').value)||0,
    prep_air_naoh_l: parseFloat(document.getElementById('fik_prep_air_naoh_l').value)||0,
    prep_air_hidroflok_l: parseFloat(document.getElementById('fik_prep_air_hidroflok_l').value)||0,
    prep_air_superflok_l: parseFloat(document.getElementById('fik_prep_air_superflok_l').value)||0,
    prep_pompa_ok: document.getElementById('fik_prep_pompa_ok').checked,
    prep_tangki_ok: document.getElementById('fik_prep_tangki_ok').checked,
    prep_keterangan: document.getElementById('fik_prep_keterangan').value,
    catatan: document.getElementById('fik_catatan').value
  };
  var waktu = FIK_SHIFT_WAKTU[shift] || ['07','12'];
  waktu.forEach(function(w) {
    FIK_FIELDS.forEach(function(f) {
      var el = document.getElementById('fik_p' + w + '_' + f);
      if (!el) return;
      var key = 'p' + w + '_' + f;
      if (f==='visual_flokulasi'||f==='visual_air'||f==='batch_lumpur') data[key] = el.value||'';
      else data[key] = parseFloat(el.value)||0;
    });
  });
  return data;
}

function handleSubmitFIK() {
  try {
    var data = collectFIKData();
    if (!data.tanggal) { showToast('Tanggal harus diisi!','error'); return; }
    showLoading(true);
    google.script.run.withSuccessHandler(function(res) {
      showLoading(false);
      if (res&&res.success) { showToast('FIK berhasil disimpan! '+res.record_id,'success'); initFIKForm_(); }
      else showToast((res&&res.message)||'Gagal','error');
    }).withFailureHandler(function(err){
      showLoading(false);
      showToast('Gagal menyimpan FIK: '+(err&&err.message?err.message:'koneksi error'),'error');
    }).createProsesClarifier(data);
  } catch (e) {
    showLoading(false);
    showToast('Error FIK: ' + e.message, 'error');
  }
}

// ========== PROSES SOFTENER ==========
function initSoftenerForm_() {
  var today = new Date().toISOString().split('T')[0];
  var hour = new Date().getHours();
  var shift = (hour>=6&&hour<14)?1:(hour>=14&&hour<22)?2:3;
  document.getElementById('sft_tanggal').value = today;
  document.getElementById('sft_nama').value = currentUser.nama;
  document.querySelectorAll('#sftShiftToggle .shift-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.shift)===shift);});
  toggleRegen(true);
}
function selectSftShift(s) { document.querySelectorAll('#sftShiftToggle .shift-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.shift)===s);}); }

function toggleRegen(isRegen) {
  document.getElementById('sftRegenYes').classList.toggle('active', isRegen);
  document.getElementById('sftRegenNo').classList.toggle('active', !isRegen);
  document.getElementById('sftGaramField').style.display = isRegen ? '' : 'none';
  if (!isRegen) document.getElementById('sft_garam_kg').value = '';
}

function handleSubmitSoftener() {
  try {
    var as = document.querySelector('#sftShiftToggle .shift-btn.active');
    var isRegen = document.getElementById('sftRegenYes').classList.contains('active');
    var data = {
      tanggal: document.getElementById('sft_tanggal').value,
      shift: as ? parseInt(as.dataset.shift) : 1,
      nama_operator: document.getElementById('sft_nama').value,
      user_id: currentUser.user_id,
      regenerasi: isRegen,
      garam_kg: isRegen ? (parseFloat(document.getElementById('sft_garam_kg').value)||0) : 0,
      catatan: document.getElementById('sft_catatan').value
    };
    if (!data.tanggal) { showToast('Tanggal harus diisi!','error'); return; }
    showLoading(true);
    google.script.run.withSuccessHandler(function(res) {
      showLoading(false);
      if (res&&res.success) { showToast('Softener berhasil disimpan! '+res.record_id,'success'); initSoftenerForm_(); document.getElementById('sft_garam_kg').value=''; document.getElementById('sft_catatan').value=''; }
      else showToast((res&&res.message)||'Gagal','error');
    }).withFailureHandler(function(err){
      showLoading(false);
      showToast('Gagal menyimpan Softener: '+(err&&err.message?err.message:'koneksi error'),'error');
    }).createProsesSoftener(data);
  } catch (e) {
    showLoading(false);
    showToast('Error Softener: ' + e.message, 'error');
  }
}

// ========== MAINTENANCE ==========
var MNT_CLR_OK = ['mnt_clr_tangki','mnt_clr_tangki_flokulan','mnt_clr_tangki_floagulan','mnt_clr_tangki_chemical','mnt_clr_pompa_clarifier','mnt_clr_keseluruhan_proses','mnt_clr_pompa_siplai_leaching','mnt_clr_filter_press_1','mnt_clr_filter_press_2','mnt_clr_kolam'];
var MNT_CLR_GD = ['mnt_clr_fungsi_proses','mnt_clr_5r_area'];
var MNT_SFT_OK = ['mnt_sft_tangki_air_baku','mnt_sft_tangki_sand_filter','mnt_sft_tangki_garam','mnt_sft_tangki_softener','mnt_sft_tangki_hasil','mnt_sft_valve_piping'];
var MNT_SFT_GD = ['mnt_sft_fungsi_proses','mnt_sft_5r_area'];
var MNT_ALL = MNT_CLR_OK.concat(MNT_CLR_GD).concat(MNT_SFT_OK).concat(MNT_SFT_GD);

function initMaintenanceForm_() {
  var today = new Date().toISOString().split('T')[0];
  var hour = new Date().getHours();
  var shift = (hour>=6&&hour<14)?1:(hour>=14&&hour<22)?2:3;
  document.getElementById('mnt_tanggal').value = today;
  document.getElementById('mnt_nama').value = currentUser.nama;
  document.querySelectorAll('#mntShiftToggle .shift-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.shift)===shift);});
  MNT_ALL.forEach(function(id) { document.getElementById(id).checked = false; });
  document.getElementById('mnt_catatan').value = '';
}
function selectMntShift(s) { document.querySelectorAll('#mntShiftToggle .shift-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.shift)===s);}); }

function handleSubmitMaintenance() {
  try {
    var as = document.querySelector('#mntShiftToggle .shift-btn.active');
    var data = {
      tanggal: document.getElementById('mnt_tanggal').value,
      shift: as ? parseInt(as.dataset.shift) : 1,
      nama_operator: document.getElementById('mnt_nama').value,
      user_id: currentUser.user_id,
      mnt_catatan: document.getElementById('mnt_catatan').value
    };
    MNT_ALL.forEach(function(id) { data[id] = document.getElementById(id).checked; });
    if (!data.tanggal) { showToast('Tanggal harus diisi!','error'); return; }
    showLoading(true);
    google.script.run.withSuccessHandler(function(res) {
      showLoading(false);
      if (res&&res.success) { showToast('Maintenance berhasil disimpan! '+res.record_id,'success'); initMaintenanceForm_(); }
      else showToast((res&&res.message)||'Gagal','error');
    }).withFailureHandler(function(err){
      showLoading(false);
      showToast('Gagal menyimpan Maintenance: '+(err&&err.message?err.message:'koneksi error'),'error');
    }).createMaintenance(data);
  } catch (e) {
    showLoading(false);
    showToast('Error Maintenance: ' + e.message, 'error');
  }
}

// ========== DATABASE LIST ==========
function loadRecords(page) {
  currentPage = page || 1;
  var container = document.getElementById('recordsList');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>';
  var options = {
    page: currentPage, limit: 15,
    shift: document.getElementById('db_filter_shift').value || null,
    startDate: document.getElementById('db_filter_date_start').value || null,
    endDate: document.getElementById('db_filter_date_end').value || null,
    search: document.getElementById('db_search').value || null
  };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res) { container.innerHTML = '<div class="empty-state"><span class="material-icons-round">error</span><p>Server mengembalikan null — deploy ulang versi baru lalu refresh (Ctrl+Shift+R)</p></div>'; return; }
      if (res.success) { renderRecords(res.records, res.total, res.page, res.totalPages); }
      else { container.innerHTML = '<div class="empty-state"><span class="material-icons-round">error</span><p>' + (res.message||'Error') + '</p></div>'; }
    })
    .withFailureHandler(function(e) {
      container.innerHTML = '<div class="empty-state"><span class="material-icons-round">cloud_off</span><p>Gagal memuat: ' + (e&&e.message?escHtml(e.message):'koneksi gagal') + '</p></div>';
    })
    .readRecords(options);
}

function renderRecords(records, total, page, totalPages) {
  var container = document.getElementById('recordsList');
  if (!records || records.length === 0) { container.innerHTML = '<div class="empty-state"><span class="material-icons-round">inbox</span><p>Belum ada data</p></div>'; document.getElementById('pagination').innerHTML = ''; return; }
  var html = '';
  records.forEach(function(r) {
    var chkMg=(r.chk_mg17_18===true||r.chk_mg17_18==='true'),chkCl=(r.chk_clarifier===true||r.chk_clarifier==='true'),chkFe=(r.chk_fe_removal===true||r.chk_fe_removal==='true'),chkBsb=(r.chk_bak_sirkulasi_besar===true||r.chk_bak_sirkulasi_besar==='true');
    html += '<div class="record-card"><div class="rc-header"><span class="rc-date">' + escHtml(r.tanggal_display||r.tanggal) + '</span><span class="rc-shift s' + r.shift + '">Shift ' + r.shift + '</span></div>';
    html += '<div class="rc-operator">' + escHtml(r.nama_operator) + '</div>';
    html += '<div class="rc-badges"><span class="rc-badge ' + (chkMg?'on':'off') + '">MG 17-18</span><span class="rc-badge ' + (chkCl?'on':'off') + '">Clarifier</span><span class="rc-badge ' + (chkFe?'on':'off') + '">Fe Removal</span><span class="rc-badge ' + (chkBsb?'on':'off') + '">Bak Sirk. Besar</span></div>';
    html += '<div class="rc-chem">HF: ' + (r.chem_hydrofloc_kg||0) + ' kg | Poly: ' + (r.chem_polymer_g||0) + ' g</div>';
    html += '<div class="rc-actions"><button class="btn-view" onclick="viewRecord(\'' + r.record_id + '\')"><span class="material-icons-round" style="font-size:16px">visibility</span> Lihat</button>';
    if (!isVisitor()) {
      html += '<button class="btn-edit" onclick="openEditModal(\'' + r.record_id + '\')"><span class="material-icons-round" style="font-size:16px">edit</span> Edit</button>';
      html += '<button class="btn-delete-card" onclick="openDeleteModal(\'' + r.record_id + '\',\'' + escHtml(r.tanggal_display||r.tanggal) + '\',' + r.shift + ',\'' + escHtml(r.nama_operator) + '\')"><span class="material-icons-round" style="font-size:16px">delete</span> Hapus</button>';
    }
    html += '</div></div>';
  });
  container.innerHTML = html;
  renderPagination(page, totalPages, total);
}

function renderPagination(page, totalPages, total) {
  var el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = '<span class="page-info">' + total + ' record</span>'; return; }
  var html = '<button ' + (page<=1?'disabled':'') + ' onclick="loadRecords(' + (page-1) + ')">&laquo;</button>';
  for (var i = Math.max(1,page-2); i <= Math.min(totalPages,page+2); i++) html += '<button class="' + (i===page?'active':'') + '" onclick="loadRecords(' + i + ')">' + i + '</button>';
  html += '<button ' + (page>=totalPages?'disabled':'') + ' onclick="loadRecords(' + (page+1) + ')">&raquo;</button><span class="page-info">' + total + ' record</span>';
  el.innerHTML = html;
}
function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(function() { loadRecords(1); }, 400); }

  document.getElementById('db_search').value = '';

  document.getElementById('db_filter_date_start').value = start.toISOString().split('T')[0];

}

  if(fmt==='sheet'){
    var modeLabel=mode==='harian'?'Per Hari':'Per Periode';
    st.innerHTML='<div class="loading-state"><div class="spinner"></div><p>Membuat sheet ('+modeLabel+')...</p></div>';
    var opts={startDate:String(s),endDate:String(e),generatedBy:String(currentUser.nama),mode:String(mode)};
    google.script.run.withSuccessHandler(function(res){if(res&&res.success){st.innerHTML='<div class="chart-note"><strong>Sheet berhasil dibuat!</strong><br>Buka spreadsheet, cari tab: <strong>'+escHtml(res.sheetName)+'</strong></div>';showToast('Sheet '+res.sheetName+' berhasil dibuat!','success');}else{st.innerHTML='<div class="chart-note chart-note-warn">'+escHtml((res&&res.message)||'Gagal')+'</div>';}}).withFailureHandler(function(err){st.innerHTML='<div class="chart-note chart-note-warn">Gagal: '+(err&&err.message?escHtml(err.message):'koneksi error')+'</div>';}).generateReport(opts);
    return;
  }
  var fmtLabel=fmt==='xlsx'?'Excel':fmt==='csv'?'CSV':'PDF';var modeLabel2=mode==='harian'?'Per Hari':'Per Periode';
  st.innerHTML='<div class="loading-state"><div class="spinner"></div><p>Membuat '+fmtLabel+' ('+modeLabel2+')...</p></div>';
  var opts2={startDate:String(s),endDate:String(e),generatedBy:String(currentUser.nama),format:String(fmt),mode:String(mode)};
  google.script.run.withSuccessHandler(function(res){if(res&&res.success){downloadBase64File(res.data,res.filename,res.mimeType);st.innerHTML='<div class="chart-note"><strong>Download berhasil!</strong><br>File: <strong>'+escHtml(res.filename)+'</strong></div>';showToast('File '+fmtLabel+' berhasil di-download!','success');}else{st.innerHTML='<div class="chart-note chart-note-warn">'+escHtml((res&&res.message)||'Gagal')+'</div>';}}).withFailureHandler(function(err){st.innerHTML='<div class="chart-note chart-note-warn">Gagal: '+(err&&err.message?escHtml(err.message):'koneksi error')+'</div>';}).exportReportFile(opts2);
}
function downloadBase64File(base64,filename,mimeType){var raw=atob(base64);var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);var blob=new Blob([arr],{type:mimeType});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);}

// ========== THEME ==========
function toggleTheme(){var html=document.documentElement;var cur=html.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('wwtp_theme',next);document.getElementById('themeIcon').textContent=next==='dark'?'dark_mode':'light_mode';var sbi=document.getElementById('themeIconSidebar');if(sbi)sbi.textContent=next==='dark'?'dark_mode':'light_mode';
if(next==='light'){C.text='#3D4654';C.grid='rgba(0,0,0,0.08)';C.accent='#16A34A';C.sky='#0284C7';C.orange='#EA580C';C.success='#16A34A';C.warning='#CA8A04';C.danger='#DC2626';C.purple='#7C3AED';C.pink='#DB2777';}else{C.text='#B0B9CC';C.grid='rgba(255,255,255,0.08)';C.accent='#4ADE80';C.sky='#38BDF8';C.orange='#FB923C';C.success='#4ADE80';C.warning='#FACC15';C.danger='#F87171';C.purple='#A78BFA';C.pink='#F472B6';}
if(_dashData)renderDashboard(_dashData);if(_qualityData)renderQualityCharts(_qualityData);}
(function(){var saved=localStorage.getItem('wwtp_theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var icon=document.getElementById('themeIcon');if(icon)icon.textContent=saved==='dark'?'dark_mode':'light_mode';var sbi=document.getElementById('themeIconSidebar');if(sbi)sbi.textContent=saved==='dark'?'dark_mode':'light_mode';})();

// ========== UTILITIES ==========
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');var dur=type==='error'?5000:3000;setTimeout(function(){t.className='toast';},dur);}
function showLoading(show){document.getElementById('loadingOverlay').style.display=show?'flex':'none';}
function escHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
