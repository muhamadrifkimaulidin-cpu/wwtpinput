<script>
/* ============================================
   JavaScript — WWTP Operations System v6
   Form berbasis schema untuk semua modul, sesi token,
   list data, request/approval, anomali, laporan.
   ============================================ */

// ========== SCHEMA MODUL ==========
function ck(k, l) { return { k: k, l: l, t: 'ck' }; }
function num(k, l, u, ph) { return { k: k, l: l, t: 'num', u: u || '', ph: ph || '' }; }
function txt(k, l, ph) { return { k: k, l: l, t: 'txt', ph: ph || '' }; }
function area(k, l, ph) { return { k: k, l: l, t: 'area', ph: ph || '' }; }
function dt(k, l) { return { k: k, l: l, t: 'date' }; }
function sel(k, l, o) { return { k: k, l: l, t: 'sel', o: o }; }

var SHIFT_HOURS = { 1: '06–14', 2: '14–22', 3: '22–06' };
var FIK_TIMES = { 1: ['07', '12'], 2: ['15', '19'], 3: ['23', '03'] };
var FIK_FIELDS = [
  num('rotameter', 'Rotameter'), num('flowmeter', 'Flowmeter'),
  num('stroke_naoh', 'Stroke NaOH'), num('stroke_hidroflok', 'Stroke Hidroflok'), num('stroke_superflok', 'Stroke Superflok'),
  num('ph', 'pH'), sel('visual_flokulasi', 'Visual Flokulasi', ['Baik', 'Cukup', 'Buruk']),
  sel('visual_air', 'Visual Air', ['Jernih', 'Keruh', 'Sangat Keruh']), txt('batch_lumpur', 'Batch Lumpur')
];
var PG_SUMUR = [1, 2, 3, 4, 5, 6];
var PG_KONDISI = ['Normal', 'Abnormal', 'Pompa Mati'];
var CLR_ROWS = [['bak_sirkulasi', 'Bak Sirkulasi'], ['sungai', 'Sungai'], ['mg17_18', 'MG 17-18']];
var FM_KEYS = ['fm_softener_lt3', 'fm_flotation', 'fm_mg16', 'fm_pam', 'fm_pam_shift', 'fm_sm1', 'fm_sm2', 'fm_sm3', 'fm_sm4', 'fm_sm5', 'fm_sm6', 'fm_leaching'];

var MODS = {
  ops: { title: 'Operasional', sections: [
    { t: 'Checklist Proses', f: [ck('chk_mg17_18', 'Proses MG 17-18'), ck('chk_clarifier', 'Clarifier'), ck('chk_fe_removal', 'Fe Removal'), ck('chk_bak_sirkulasi_besar', 'Bak Sirkulasi Besar')] },
    { t: 'Data Clarifier', type: 'pair' },
    { t: 'Flow Meter', f: [num('fm_softener_lt3', 'Softener lt.3'), num('fm_flotation', 'Flotation'), num('fm_mg16', 'MG 16'), num('fm_pam', 'PAM Awal'), num('fm_pam_shift', 'PAM Akhir'),
      num('fm_sm1', 'Sm 1'), num('fm_sm2', 'Sm 2'), num('fm_sm3', 'Sm 3'), num('fm_sm4', 'Sm 4'), num('fm_sm5', 'Sm 5'), num('fm_sm6', 'Sm 6'), num('fm_leaching', 'FM Leaching', 'm³')] },
    { t: 'Filter Press', f: [txt('filter_press_batch', 'Nomor Batch Filter Press', 'FP-001, FP-002'), txt('bongkar_lumpur', 'Bongkar Lumpur', 'Keterangan bongkar lumpur')] },
    { t: 'Sample Lab', f: [dt('lab_tanggal', 'Tanggal Pengiriman Sample'), ck('lab_clarifier', 'Clarifier'), ck('lab_mg17_18', 'MG 17-18'), ck('lab_bak_sirkulasi', 'Bak Sirkulasi'),
      ck('lab_demin', 'Softener (Demin)'), ck('lab_pam', 'PAM'), ck('lab_sm1', 'Sm 1'), ck('lab_sm2', 'Sm 2'), ck('lab_sm3', 'Sm 3'), ck('lab_sm4', 'Sm 4'), ck('lab_sm5', 'Sm 5'), ck('lab_sm6', 'Sm 6')] },
    { t: 'Chemical', f: [num('chem_hydrofloc_kg', 'Hydrofloc', 'kg'), num('chem_polymer_g', 'Polymer', 'g')] },
    { t: 'Pekerjaan Tambahan', f: [area('pekerjaan_tambahan', 'Pekerjaan di luar rutin', 'Tuliskan pekerjaan tambahan…')] },
    { t: 'Catatan', f: [area('catatan', 'Catatan', 'Catatan tambahan…')] }
  ]},
  fik: { title: 'FIK Clarifier', sections: [
    { t: 'Persiapan Proses', f: [num('prep_naoh_flake_kg', 'NaOH Flake', 'kg', '50'), num('prep_hidroflok_kg', 'Hidroflok', 'kg', '50'), num('prep_superflok_g', 'Superflok', 'g', '250'),
      num('prep_air_naoh_l', 'Air NaOH', 'L', '450'), num('prep_air_hidroflok_l', 'Air Hidroflok', 'L', '450'), num('prep_air_superflok_l', 'Air Superflok', 'L', '500'),
      ck('prep_pompa_ok', 'Pompa (supply/transfer) berfungsi'), ck('prep_tangki_ok', 'Tangki, pengaduk, pipa, valve berfungsi'),
      area('prep_keterangan', 'Keterangan abnormal', 'Catat jika ada kondisi alat abnormal…')] },
    { t: 'Data Proses per Jam', type: 'fik' },
    { t: 'Catatan', f: [area('catatan', 'Catatan', 'Keterangan / catatan…')] }
  ]},
  sft: { title: 'Softener', sections: [
    { t: 'Regenerasi', f: [{ k: 'regenerasi', l: 'Status regenerasi', t: 'tog', o: ['Ada Regenerasi', 'Tidak Ada'], def: true },
      { k: 'garam_kg', l: 'Pemakaian Garam', t: 'num', u: 'kg', showIf: 'regenerasi' }] },
    { t: 'Catatan', f: [area('catatan', 'Catatan', 'Catatan tambahan…')] }
  ]},
  mnt: { title: 'Maintenance', sections: [
    { t: 'Clarifier — OK / Not OK', f: [ck('mnt_clr_tangki', 'Cek kondisi tangki'), ck('mnt_clr_tangki_flokulan', 'Cek tangki flokulan'), ck('mnt_clr_tangki_floagulan', 'Cek tangki floagulan'),
      ck('mnt_clr_tangki_chemical', 'Cek tangki chemical'), ck('mnt_clr_pompa_clarifier', 'Cek kondisi pompa clarifier'), ck('mnt_clr_keseluruhan_proses', 'Cek keseluruhan proses'),
      ck('mnt_clr_pompa_siplai_leaching', 'Cek pompa siplai leaching'), ck('mnt_clr_filter_press_1', 'Cek filter press 1'), ck('mnt_clr_filter_press_2', 'Cek filter press 2'), ck('mnt_clr_kolam', 'Cek kondisi kolam')] },
    { t: 'Clarifier — Good / No Good', f: [ck('mnt_clr_fungsi_proses', 'Keseluruhan fungsi proses clarifier'), ck('mnt_clr_5r_area', '5R area clarifier')] },
    { t: 'Softener — OK / Not OK', f: [ck('mnt_sft_tangki_air_baku', 'Cek tangki air baku'), ck('mnt_sft_tangki_sand_filter', 'Cek tangki sand filter'), ck('mnt_sft_tangki_garam', 'Cek tangki garam'),
      ck('mnt_sft_tangki_softener', 'Cek tangki softener'), ck('mnt_sft_tangki_hasil', 'Cek tangki hasil softener'), ck('mnt_sft_valve_piping', 'Cek valve dan piping')] },
    { t: 'Softener — Good / No Good', f: [ck('mnt_sft_fungsi_proses', 'Keseluruhan fungsi proses softener'), ck('mnt_sft_5r_area', '5R area softener')] },
    { t: 'Catatan', f: [area('mnt_catatan', 'Catatan', 'Catatan maintenance…')] }
  ]},
  pg: { title: 'Pressure Gauge', sections: [
    { t: 'Pressure Gauge Pompa Sumur', type: 'pg' },
    { t: 'Catatan', f: [area('pg_catatan', 'Catatan', 'Contoh: jarum gauge goyang, kebocoran, dll…')] }
  ]}
};
var MOD_ORDER = ['ops', 'fik', 'sft', 'mnt', 'pg'];

// ========== STATE ==========
var S = {
  token: null, user: null, info: (typeof SERVER_INFO !== 'undefined' && SERVER_INFO) || {}, clockOffset: 0,
  page: 'pgInput', inputMod: 'ops', dataMod: 'ops', form: { tanggal: '', shift: 1 },
  prevFM: null, lsSeq: 0, dataRecs: {}, dataPage: 1, reqFilter: 'pending', ntfFilter: 'unread',
  reqCache: [], ntfCache: [], edit: null, dlgOk: null, badgeTimer: null, searchTimer: null, dataInit: false, reportInit: false
};

// ========== UTIL ==========
function $(id) { return document.getElementById(id); }
function esc(s) { return (s === null || s === undefined) ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function jsId(s) { return String(s || '').replace(/[^A-Za-z0-9_\-]/g, ''); }
function isTrue(v) { return v === true || v === 'true' || v === 'TRUE'; }
function blank(v) { return v === '' || v === null || v === undefined; }
function slug(t) { return String(t).toLowerCase().replace(/[—–]/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '/'; }
function addDays(ymd, n) { var p = ymd.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function fmtD(ymd) { if (!ymd || !/^\d{4}-\d{2}-\d{2}/.test(ymd)) return ymd || '–'; var p = ymd.split('-'); return parseInt(p[2], 10) + ' ' + BULAN[parseInt(p[1], 10) - 1] + ' ' + p[0]; }
function fmtDT(iso) {
  if (!iso) return '–';
  var d = new Date(iso); if (isNaN(d.getTime())) return String(iso);
  try { return d.toLocaleString('id-ID', { timeZone: S.info.timezone || undefined, day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return d.toLocaleString('id-ID'); }
}
function fmtNum(v, u) { return blank(v) ? '–' : esc(v) + (u ? ' ' + esc(u) : ''); }
function unitOf(f) { return f.u === 'PG' ? (S.info.pgUnit || 'bar') : f.u; }

function toast(msg, type) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type || '');
  clearTimeout(S.toastTimer); S.toastTimer = setTimeout(function() { t.className = 'toast'; }, type === 'error' ? 6000 : 3500);
}
function loading(on) { $('loading').classList.toggle('on', !!on); }

// ========== SERVER CALL ==========
function call(fn, args, ok, fail) {
  var r = google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.authError) { loading(false); forceLogout(res.message); return; }
      if (ok) ok(res);
    })
    .withFailureHandler(function(err) {
      loading(false);
      if (fail) fail(err); else toast('Gagal: ' + (err && err.message ? err.message : 'koneksi error'), 'error');
    });
  r[fn].apply(r, args || []);
}
function callAuth(fn, args, ok, fail) { call(fn, [S.token].concat(args || []), ok, fail); }

// ========== THEME ==========
function applyThemeUi() {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  document.querySelectorAll('.theme-ic').forEach(function(el) { el.textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; });
  document.querySelectorAll('.theme-lbl').forEach(function(el) { el.textContent = t; });
}
function toggleTheme() {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('wwtp_theme', t); } catch (e) {}
  applyThemeUi();
}

// ========== CLOCK / TOPBAR ==========
var clockFmt = null;
function setServerInfo(info) {
  if (!info) return;
  S.info = info;
  if (info.serverTime) S.clockOffset = info.serverTime - Date.now();
  try { clockFmt = new Intl.DateTimeFormat('en-GB', { timeZone: info.timezone || undefined, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); } catch (e) { clockFmt = null; }
  updateTopbar();
}
function tickClock() {
  var d = new Date(Date.now() + S.clockOffset);
  var s = clockFmt ? clockFmt.format(d) : d.toTimeString().slice(0, 8);
  $('tbClock').textContent = s.split(':').join(' : ');
}
function updateTopbar() {
  var names = { pgInput: 'input', pgData: 'data', pgRequest: 'request', pgAnomali: 'anomali', pgReport: 'laporan' };
  $('tbPath').textContent = 'wwtp-ops/' + (S.user ? names[S.page] || '' : 'login');
  $('tbMeta').textContent = S.info.shift ? 'shift-' + S.info.shift : '';
  var ld = $('loginDate'); if (ld) ld.textContent = fmtD(S.info.calendarToday || S.info.today).toLowerCase() + ' / ' + (S.info.timezone || '').toLowerCase();
}
function refreshServerInfo(cb) {
  call('getServerInfo', [], function(info) { setServerInfo(info); if (cb) cb(); }, function() { if (cb) cb(); });
}

// ========== AUTH ==========
function handleLogin() {
  var name = $('loginName').value.trim(), pass = $('loginPassword').value.trim();
  var err = $('loginError'); err.textContent = '';
  if (!name || !pass) { err.textContent = 'Mohon isi nama dan password.'; return; }
  var btn = $('btnLogin'); btn.disabled = true; btn.firstChild.textContent = 'Memverifikasi…';
  var reset = function() { btn.disabled = false; btn.firstChild.textContent = 'Masuk'; };
  call('loginUser', [name, pass], function(res) {
    reset();
    if (res && res.success) {
      S.token = res.token; S.user = res.user;
      try { sessionStorage.setItem('wwtp_sess', JSON.stringify({ token: S.token, user: S.user })); } catch (e) {}
      $('loginPassword').value = '';
      enterApp();
    } else { err.textContent = (res && res.message) || 'Login gagal.'; }
  }, function() { reset(); err.textContent = 'Koneksi gagal. Coba lagi.'; });
}
function handleLogout() {
  if (S.token) call('logoutUser', [S.token]);
  clearSession(); showLogin('');
}
function forceLogout(msg) { clearSession(); showLogin(msg || 'Sesi berakhir. Silakan login ulang.'); }
function clearSession() {
  S.token = null; S.user = null; clearInterval(S.badgeTimer);
  try { sessionStorage.removeItem('wwtp_sess'); } catch (e) {}
}
function showLogin(msg) {
  closeSheet();
  $('mainApp').classList.remove('active'); $('loginScreen').classList.add('active');
  $('loginError').textContent = msg || '';
  updateTopbar();
}
function isVisitor() { return S.user && S.user.role === 'visitor'; }

function enterApp() {
  $('loginScreen').classList.remove('active'); $('mainApp').classList.add('active');
  $('navUser').textContent = S.user.nama;
  $('navRole').textContent = S.user.isApprover ? 'approver' : S.user.role;
  document.body.classList.toggle('hide-visitor', isVisitor());
  S.form = { tanggal: S.info.today, shift: S.info.shift || 1 };
  refreshServerInfo(function() {
    S.form = { tanggal: S.info.today, shift: S.info.shift || 1 };
    if (!isVisitor()) { renderInputMeta(); renderModTabs('inputModTabs', S.inputMod, 'switchInputMod'); renderEntryForm(); }
  });
  goPage(isVisitor() ? 'pgData' : 'pgInput');
  loadBadges();
  clearInterval(S.badgeTimer); S.badgeTimer = setInterval(loadBadges, 120000);
}

// ========== NAVIGATION ==========
function goPage(id) {
  if (id === 'pgInput' && isVisitor()) id = 'pgData';
  S.page = id;
  document.querySelectorAll('.page').forEach(function(p) { p.classList.toggle('active', p.id === id); });
  document.querySelectorAll('[data-page]').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-page') === id); });
  updateTopbar();
  window.scrollTo(0, 0);
  if (id === 'pgInput') { renderInputMeta(); renderModTabs('inputModTabs', S.inputMod, 'switchInputMod'); if (!$('entryForm').innerHTML) renderEntryForm(); }
  if (id === 'pgData') { initDataFilters(); renderModTabs('dataModTabs', S.dataMod, 'switchDataMod'); loadData(1); }
  if (id === 'pgRequest') loadRequests();
  if (id === 'pgAnomali') loadNotifs();
  if (id === 'pgReport') initReport();
}

function renderModTabs(containerId, active, handler) {
  $(containerId).innerHTML = MOD_ORDER.map(function(k, i) {
    return '<button type="button" class="mod-tab' + (k === active ? ' active' : '') + '" onclick="' + handler + '(\'' + k + '\')"><small>0' + (i + 1) + '/</small><span>' + esc(MODS[k].title) + '</span></button>';
  }).join('');
}

function setBadge(kind, n) {
  document.querySelectorAll('[data-badge="' + kind + '"]').forEach(function(b) { b.textContent = n > 99 ? '99+' : n; b.classList.toggle('on', n > 0); });
}
function loadBadges() {
  if (!S.token) return;
  callAuth('getNotifications', [{ countOnly: true }], function(res) { if (res && res.success) setBadge('ntf', res.unreadCount || 0); }, function() {});
  callAuth('getRequests', [{ countOnly: true }], function(res) { if (res && res.success) setBadge('req', res.pendingCount || 0); }, function() {});
}

// ========== FORM RENDERING (schema-driven) ==========
function val(v) { return blank(v) ? '' : esc(v); }

function fieldHtml(f, v, idp) {
  var id = idp + f.k;
  if (f.t === 'ck') {
    return '<label class="tile"><input type="checkbox" id="' + id + '"' + (isTrue(v) ? ' checked' : '') + '><span class="tile-box"></span><span>' + esc(f.l) + '</span></label>';
  }
  if (f.t === 'tog') {
    var on = blank(v) ? !!f.def : isTrue(v);
    return '<div class="fld wide"><label>' + esc(f.l) + '</label><div class="seg seg-wide" id="' + id + '" data-val="' + (on ? '1' : '0') + '">' +
      '<button type="button" class="' + (on ? 'active' : '') + '" onclick="setTog(\'' + id + '\',1)">' + esc(f.o[0]) + '</button>' +
      '<button type="button" class="' + (!on ? 'active' : '') + '" onclick="setTog(\'' + id + '\',0)">' + esc(f.o[1]) + '</button></div></div>';
  }
  var wrapAttr = f.showIf ? ' data-showif="' + idp + f.showIf + '"' : '';
  var wide = (f.t === 'area' || f.t === 'txt') ? ' wide' : '';
  var h = '<div class="fld' + wide + '"' + wrapAttr + '><label for="' + id + '">' + esc(f.l) + '</label>';
  if (f.t === 'num') {
    var u = unitOf(f);
    var fm = idp === 'f_' && FM_KEYS.indexOf(f.k) >= 0;
    h += '<div class="inp-unit"><input type="number" id="' + id + '" inputmode="decimal" step="any" value="' + val(v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') +
      (fm ? ' oninput="fmCheck(\'' + f.k + '\')"' : '') + (u ? '' : ' style="padding-right:12px"') + '>' + (u ? '<span class="unit">' + esc(u) + '</span>' : '') + '</div>';
    if (fm) h += '<span class="ref" id="f_ref_' + f.k + '"></span>';
  } else if (f.t === 'txt') {
    h += '<input type="text" id="' + id + '" value="' + val(v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
  } else if (f.t === 'area') {
    h += '<textarea id="' + id + '" rows="3"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>' + val(v) + '</textarea>';
  } else if (f.t === 'date') {
    h += '<input type="date" id="' + id + '" value="' + val(v) + '">';
  } else if (f.t === 'sel') {
    h += '<select id="' + id + '"' + (f.onchange ? ' onchange="' + f.onchange + '"' : '') + '><option value="">—</option>' + f.o.map(function(o) { return '<option' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  }
  return h + '</div>';
}

function fieldsBlock(fields, vals, idp) {
  var out = '', buf = [], kind = null;
  function flush() {
    if (!buf.length) return;
    out += '<div class="' + (kind === 'ck' ? 'tiles' : 'grid') + '">' + buf.join('') + '</div>';
    buf = [];
  }
  fields.forEach(function(f) {
    var k = f.t === 'ck' ? 'ck' : 'fld';
    if (k !== kind) { flush(); kind = k; }
    buf.push(fieldHtml(f, vals[f.k], idp));
  });
  flush();
  return out;
}

function pairHtml(vals, idp) {
  var h = '<div class="pair"><span></span><span class="pair-h">sebelum</span><span class="pair-h">sesudah</span><span class="pair-h" style="text-align:right">selisih</span>';
  CLR_ROWS.forEach(function(r) {
    var b = 'clr_' + r[0] + '_before', a = 'clr_' + r[0] + '_after';
    var oi = ' oninput="calcDiff(\'' + idp + '\',\'' + r[0] + '\')"';
    h += '<span class="pair-l">' + esc(r[1]) + '</span>' +
      '<input type="number" step="any" inputmode="decimal" id="' + idp + b + '" value="' + val(vals[b]) + '"' + oi + ' aria-label="' + esc(r[1]) + ' sebelum">' +
      '<input type="number" step="any" inputmode="decimal" id="' + idp + a + '" value="' + val(vals[a]) + '"' + oi + ' aria-label="' + esc(r[1]) + ' sesudah">' +
      '<span class="diff" id="' + idp + 'diff_' + r[0] + '">0</span>';
  });
  return h + '</div>';
}

function fikSlotsHtml(vals, shift, idp) {
  return '<div class="slots">' + (FIK_TIMES[shift] || FIK_TIMES[1]).map(function(w) {
    var fs = FIK_FIELDS.map(function(f) { var g = {}; for (var x in f) g[x] = f[x]; g.k = 'p' + w + '_' + f.k; return g; });
    return '<div class="slot"><div class="slot-h"><b>' + w + ':00</b><span class="slug">jam/</span></div><div class="slot-b">' + fieldsBlock(fs, vals, idp) + '</div></div>';
  }).join('') + '</div>';
}

function pgHtml(vals, idp) {
  var u = S.info.pgUnit || 'bar';
  return '<div class="slot">' + PG_SUMUR.map(function(n) {
    var pk = 'pg_sm' + n + '_pressure', kk = 'pg_sm' + n + '_kondisi';
    var kond = vals[kk] || '';
    return '<div class="pg-row' + pgRowClass(kond) + '" id="' + idp + 'pgrow_' + n + '"><span class="pg-name">Sm ' + n + '</span>' +
      fieldHtml({ k: pk, l: 'Tekanan', t: 'num', u: u }, vals[pk], idp) +
      fieldHtml({ k: kk, l: 'Kondisi', t: 'sel', o: PG_KONDISI, onchange: 'pgRowState(\'' + idp + '\',' + n + ')' }, kond, idp) + '</div>';
  }).join('') + '</div>';
}
function pgRowClass(k) { return k === 'Abnormal' ? ' abn' : (k === 'Pompa Mati' ? ' off' : ''); }
function pgRowState(idp, n) { var row = $(idp + 'pgrow_' + n); row.className = 'pg-row' + pgRowClass($(idp + 'pg_sm' + n + '_kondisi').value); }

function sectionHint(modKey, sec) {
  if (sec.type === 'pair') return 'sebelum = sesudah shift lalu';
  if (sec.type === 'fik') return 'jam sesuai shift';
  if (sec.type === 'pg') return 'satuan: ' + (S.info.pgUnit || 'bar');
  return '';
}

function renderForm(modKey, vals, shift, idp) {
  vals = vals || {};
  return MODS[modKey].sections.map(function(sec) {
    var body;
    if (sec.type === 'pair') body = pairHtml(vals, idp);
    else if (sec.type === 'fik') body = '<div id="' + idp + 'fikSlots">' + fikSlotsHtml(vals, shift, idp) + '</div>';
    else if (sec.type === 'pg') body = pgHtml(vals, idp);
    else body = fieldsBlock(sec.f, vals, idp);
    var hint = sectionHint(modKey, sec);
    return '<section class="fs"><div class="fs-head"><span class="slug">' + esc(slug(sec.t)) + '</span>' + (hint ? '<span class="hint" id="' + idp + 'hint_' + (sec.type || '') + '">' + esc(hint) + '</span>' : '') + '</div><div class="fs-body">' + body + '</div></section>';
  }).join('');
}

function afterRender(modKey, idp) {
  if (modKey === 'ops') CLR_ROWS.forEach(function(r) { calcDiff(idp, r[0]); });
  if (modKey === 'sft') { var t = $(idp + 'regenerasi'); if (t) setTog(idp + 'regenerasi', t.getAttribute('data-val') === '1' ? 1 : 0); }
}

function setTog(id, on) {
  var el = $(id); if (!el) return;
  el.setAttribute('data-val', on ? '1' : '0');
  var b = el.querySelectorAll('button'); b[0].classList.toggle('active', !!on); b[1].classList.toggle('active', !on);
  document.querySelectorAll('[data-showif="' + id + '"]').forEach(function(w) { w.style.display = on ? '' : 'none'; });
}

function calcDiff(idp, name) {
  var b = parseFloat(($(idp + 'clr_' + name + '_before') || {}).value) || 0;
  var a = parseFloat(($(idp + 'clr_' + name + '_after') || {}).value) || 0;
  var el = $(idp + 'diff_' + name); if (!el) return;
  var d = Math.round((a - b) * 100) / 100;
  el.textContent = (d > 0 ? '+' : '') + d;
  el.classList.toggle('neg', d < 0 && a > 0);
}

/** Iterasi semua field modul (termasuk field dinamis: clarifier, FIK per jam, PG per sumur) */
function eachField(modKey, shift, fn) {
  MODS[modKey].sections.forEach(function(sec) {
    if (sec.type === 'pair') {
      CLR_ROWS.forEach(function(r) {
        fn(num('clr_' + r[0] + '_before', r[1] + ' sebelum'), sec);
        fn(num('clr_' + r[0] + '_after', r[1] + ' sesudah'), sec);
      });
    } else if (sec.type === 'fik') {
      (FIK_TIMES[shift] || FIK_TIMES[1]).forEach(function(w) {
        FIK_FIELDS.forEach(function(f) { var g = {}; for (var x in f) g[x] = f[x]; g.k = 'p' + w + '_' + f.k; g.l = w + ':00 · ' + f.l; fn(g, sec); });
      });
    } else if (sec.type === 'pg') {
      PG_SUMUR.forEach(function(n) {
        fn({ k: 'pg_sm' + n + '_pressure', l: 'Sm ' + n + ' · tekanan', t: 'num', u: 'PG' }, sec);
        fn({ k: 'pg_sm' + n + '_kondisi', l: 'Sm ' + n + ' · kondisi', t: 'sel', o: PG_KONDISI }, sec);
      });
    } else {
      sec.f.forEach(function(f) { fn(f, sec); });
    }
  });
}

function collect(modKey, idp, shift) {
  var data = {};
  eachField(modKey, shift, function(f) {
    var el = $(idp + f.k); if (!el) return;
    if (f.t === 'ck') data[f.k] = el.checked;
    else if (f.t === 'tog') data[f.k] = el.getAttribute('data-val') === '1';
    else if (f.t === 'num') { var n = parseFloat(el.value); data[f.k] = el.value === '' || isNaN(n) ? '' : n; }
    else data[f.k] = el.value;
  });
  if (modKey === 'sft' && !data.regenerasi) data.garam_kg = 0;
  return data;
}

// ========== INPUT PAGE ==========
function renderInputMeta() {
  if (!S.user || isVisitor()) return;
  var h = '<div class="meta-cell"><span class="slug">tanggal/</span><input type="date" id="m_tanggal" value="' + esc(S.form.tanggal) + '" onchange="onMetaDate(this.value)">' +
    '<div class="chips"><button type="button" class="chip" id="mq0" onclick="quickDate(0)">Hari ini</button><button type="button" class="chip" id="mq1" onclick="quickDate(-1)">Kemarin</button></div>' +
    '<span class="hint" id="m_dateHint"></span></div>';
  h += '<div class="meta-cell"><span class="slug">shift/</span><div class="seg seg-wide" id="m_shift">' +
    [1, 2, 3].map(function(s) { return '<button type="button" data-v="' + s + '" onclick="onMetaShift(' + s + ')">Shift ' + s + '</button>'; }).join('') +
    '</div><span class="hint" id="m_shiftHint"></span></div>';
  h += '<div class="meta-cell"><span class="slug">operator/</span><div class="meta-val">' + esc(S.user.nama) + '</div><span class="hint">' + esc(S.user.isApprover ? 'approver' : S.user.role) + '</span></div>';
  $('inputMeta').innerHTML = h;
  syncMeta();
}
function syncMeta() {
  var today = S.info.today, t = S.form.tanggal, s = S.form.shift;
  if ($('mq0')) { $('mq0').classList.toggle('active', t === today); $('mq1').classList.toggle('active', today && t === addDays(today, -1)); }
  if ($('m_tanggal') && $('m_tanggal').value !== t) $('m_tanggal').value = t;
  document.querySelectorAll('#m_shift button').forEach(function(b) { b.classList.toggle('active', parseInt(b.getAttribute('data-v'), 10) === s); });
  if ($('m_shiftHint')) $('m_shiftHint').textContent = 'jam ' + SHIFT_HOURS[s] + (s === S.info.shift && t === today ? ' · shift berjalan' : '');
  if ($('m_dateHint')) $('m_dateHint').textContent = t === today ? 'default dari waktu server (' + (S.info.timezone || '-') + ')' : 'tanggal dipilih manual';
  $('heroShift').textContent = 'S' + s;
  $('hiDate').textContent = fmtD(t).toLowerCase() + ' / shift ' + s;
  $('hiTz').textContent = 'server: ' + (S.info.timezone || '-').toLowerCase();
}
function quickDate(n) { onMetaDate(addDays(S.info.today, n)); }
function onMetaDate(v) {
  if (!v) return;
  S.form.tanggal = v; syncMeta();
  if (S.inputMod === 'ops') loadLastShift();
}
function onMetaShift(s) {
  S.form.shift = s; syncMeta();
  if (S.inputMod === 'fik' && $('f_fikSlots')) $('f_fikSlots').innerHTML = fikSlotsHtml({}, s, 'f_');
  if (S.inputMod === 'ops') loadLastShift();
}

function switchInputMod(k) {
  S.inputMod = k;
  renderModTabs('inputModTabs', k, 'switchInputMod');
  renderEntryForm();
  window.scrollTo(0, 0);
}
function renderEntryForm() {
  $('entryForm').innerHTML = renderForm(S.inputMod, {}, S.form.shift, 'f_');
  afterRender(S.inputMod, 'f_');
  if (S.inputMod === 'ops') loadLastShift();
}

/** manual=true → kosongkan isian saja; false → juga reset tanggal/shift ke default server */
function resetInput(manual) {
  if (manual) { renderEntryForm(); window.scrollTo(0, 0); return; }
  refreshServerInfo(function() {
    S.form = { tanggal: S.info.today, shift: S.info.shift || 1 };
    renderInputMeta(); renderEntryForm(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function loadLastShift() {
  S.prevFM = null;
  var seq = ++S.lsSeq, t = S.form.tanggal, s = S.form.shift;
  FM_KEYS.forEach(function(k) { var r = $('f_ref_' + k); if (r) { r.textContent = ''; r.className = 'ref'; } });
  var hint = $('f_hint_pair'); if (hint) hint.textContent = 'memuat shift sebelumnya…';
  if (!t) return;
  callAuth('getLastShiftData', [t, s], function(res) {
    if (seq !== S.lsSeq || S.inputMod !== 'ops') return;
    var hint = $('f_hint_pair');
    if (!res || !res.success || !res.data) { if (hint) hint.textContent = 'shift sebelumnya belum diinput'; return; }
    var d = res.data;
    [['bak_sirkulasi', 'clr_bak_sirkulasi'], ['sungai', 'clr_sungai'], ['mg17_18', 'clr_mg17_18']].forEach(function(p) {
      var el = $('f_clr_' + p[0] + '_before');
      if (el && d[p[1]]) el.value = d[p[1]];
      calcDiff('f_', p[0]);
    });
    S.prevFM = {};
    FM_KEYS.forEach(function(k) { S.prevFM[k] = parseFloat(d[k]) || 0; fmCheck(k); });
    if (hint) hint.textContent = 'dari S' + d.prev_shift + ' ' + fmtD(d.prev_tanggal) + ' · ' + d.prev_operator;
  }, function() {});
}

function fmCheck(k) {
  var ref = $('f_ref_' + k); if (!ref) return;
  var prev = S.prevFM ? S.prevFM[k] || 0 : 0;
  if (!prev) { ref.textContent = ''; return; }
  var cur = parseFloat(($('f_' + k) || {}).value);
  var txt = 'shift lalu: ' + prev, warn = false;
  if (!isNaN(cur) && cur > 0) {
    var d = Math.round((cur - prev) * 100) / 100;
    txt += ' · Δ ' + (d > 0 ? '+' : '') + d;
    warn = cur < prev || d > 500;
  }
  ref.textContent = txt; ref.className = 'ref' + (warn ? ' warn' : '');
}

function fmLabel(k) { var l = k; eachField('ops', 1, function(f) { if (f.k === k) l = f.l; }); return l; }

function opsWarnings(data) {
  var w = [];
  var empty = FM_KEYS.filter(function(k) { return blank(data[k]); }).map(fmLabel);
  if (empty.length) w.push('<b>Flow meter belum diisi</b> (disimpan kosong):<ul><li>' + empty.map(esc).join('</li><li>') + '</li></ul>');
  if (S.prevFM) {
    var small = [], large = [];
    FM_KEYS.forEach(function(k) {
      var prev = S.prevFM[k] || 0, cur = parseFloat(data[k]) || 0;
      if (!prev || !cur) return;
      if (cur < prev) small.push(fmLabel(k) + ' (' + cur + ' < ' + prev + ')');
      else if (cur - prev > 500) large.push(fmLabel(k) + ' (selisih ' + Math.round(cur - prev) + ')');
    });
    if (small.length) w.push('<b>FM lebih kecil dari shift sebelumnya:</b><ul><li>' + small.map(esc).join('</li><li>') + '</li></ul>');
    if (large.length) w.push('<b>Selisih FM terlalu besar (&gt;500):</b><ul><li>' + large.map(esc).join('</li><li>') + '</li></ul>');
  }
  var neg = CLR_ROWS.filter(function(r) { var b = parseFloat(data['clr_' + r[0] + '_before']) || 0, a = parseFloat(data['clr_' + r[0] + '_after']) || 0; return b > 0 && a > 0 && a < b; }).map(function(r) { return r[1]; });
  if (neg.length) w.push('<b>Selisih clarifier negatif:</b> ' + esc(neg.join(', ')) + ' — notifikasi anomali akan dikirim ke approver.');
  return w;
}

function pgWarnings(data) {
  var w = [], miss = [], noK = [];
  PG_SUMUR.forEach(function(n) {
    var p = data['pg_sm' + n + '_pressure'], k = data['pg_sm' + n + '_kondisi'];
    if (!k) noK.push('Sm ' + n);
    if (k !== 'Pompa Mati' && blank(p)) miss.push('Sm ' + n);
  });
  if (miss.length) w.push('<b>Tekanan belum diisi:</b> ' + esc(miss.join(', ')));
  if (noK.length) w.push('<b>Kondisi belum dipilih:</b> ' + esc(noK.join(', ')));
  return w;
}

function submitEntry() {
  if (isVisitor()) { toast('Akun Visitor hanya bisa melihat data.', 'error'); return; }
  if (!S.form.tanggal) { toast('Tanggal harus diisi!', 'error'); return; }
  var mod = S.inputMod;
  var data = collect(mod, 'f_', S.form.shift);
  data.tanggal = S.form.tanggal; data.shift = S.form.shift;
  var warns = mod === 'ops' ? opsWarnings(data) : (mod === 'pg' ? pgWarnings(data) : []);
  var go = function() {
    closeSheet(); loading(true);
    callAuth('createEntry', [mod, data], function(res) {
      loading(false);
      if (res && res.success) { toast(res.message + '\n' + res.record_id, 'success'); resetInput(false); }
      else toast((res && res.message) || 'Gagal menyimpan.', 'error');
    });
  };
  if (!warns.length) { go(); return; }
  confirmDlg('Periksa data', '<div class="pad"><p class="slug" style="margin-bottom:10px">' + esc(MODS[mod].title.toLowerCase()) + ' / ' + esc(fmtD(data.tanggal).toLowerCase()) + ' / shift ' + data.shift + '</p>' +
    warns.map(function(x) { return '<div class="notice warn" style="margin:0 0 10px">' + x + '</div>'; }).join('') + '<p>Data ini sudah benar?</p></div>', 'Tetap simpan', go);
}

// ========== DATA PAGE ==========
function initDataFilters() {
  if (S.dataInit) return;
  S.dataInit = true;
  $('dEnd').value = S.info.today; $('dStart').value = addDays(S.info.today, -10);
}
function resetDataFilters() {
  $('dq').value = ''; $('dShift').value = '';
  $('dEnd').value = S.info.today; $('dStart').value = addDays(S.info.today, -10);
  loadData(1);
}
function debounceData() { clearTimeout(S.searchTimer); S.searchTimer = setTimeout(function() { loadData(1); }, 400); }
function switchDataMod(k) { S.dataMod = k; renderModTabs('dataModTabs', k, 'switchDataMod'); loadData(1); window.scrollTo(0, 0); }

function loadData(page) {
  S.dataPage = page || 1;
  $('dataList').innerHTML = '<div class="loading-row"><div class="spin dark"></div></div>';
  var opts = { page: S.dataPage, limit: 15, shift: $('dShift').value || '', startDate: $('dStart').value || '', endDate: $('dEnd').value || '', search: $('dq').value || '' };
  var mod = S.dataMod;
  callAuth('listEntries', [mod, opts], function(res) {
    if (mod !== S.dataMod) return;
    if (!res || !res.success) { $('dataList').innerHTML = '<div class="empty">' + esc((res && res.message) || 'Gagal memuat.') + '</div>'; $('pager').innerHTML = ''; return; }
    renderList(res);
  }, function(err) { $('dataList').innerHTML = '<div class="empty">Gagal memuat: ' + esc(err && err.message ? err.message : 'koneksi') + '</div>'; });
}

function renderList(res) {
  S.dataRecs = {};
  $('heroTotal').textContent = res.total || 0;
  if (!res.records || !res.records.length) { $('dataList').innerHTML = '<div class="empty">belum ada data/ untuk filter ini</div>'; $('pager').innerHTML = ''; return; }
  $('dataList').innerHTML = res.records.map(function(r) {
    S.dataRecs[r.record_id] = r;
    return '<button type="button" class="row" onclick="openDetail(\'' + jsId(r.record_id) + '\')">' +
      '<span class="c-date"><b>' + esc(fmtD(r.tanggal)) + '</b><span class="shift-pill">S' + esc(r.shift) + '</span></span>' +
      '<span class="c-op">' + esc(r.nama_operator || '–') + '<small>' + esc(r.record_id) + '</small></span>' +
      '<span class="c-sum">' + summaryHtml(S.dataMod, r) + pendingTag(r) + '</span>' +
      '<span class="c-go">→</span></button>';
  }).join('');
  renderPager(res.page, res.totalPages, res.total);
}

function tag(text, cls) { return '<span class="tag' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>'; }
function pendingTag(r) { return r._pending ? tag((r._pending.type === 'edit' ? 'ubah' : 'hapus') + ' pending', 'warn') : ''; }

function summaryHtml(mod, r) {
  if (mod === 'ops') {
    return [['chk_mg17_18', 'MG 17-18'], ['chk_clarifier', 'Clarifier'], ['chk_fe_removal', 'Fe Removal'], ['chk_bak_sirkulasi_besar', 'BSB']]
      .map(function(c) { return tag(c[1], isTrue(r[c[0]]) ? 'on' : 'off'); }).join('') +
      tag('HF ' + (blank(r.chem_hydrofloc_kg) ? '–' : r.chem_hydrofloc_kg) + ' kg') + tag('Poly ' + (blank(r.chem_polymer_g) ? '–' : r.chem_polymer_g) + ' g');
  }
  if (mod === 'fik') {
    var h = tag('NaOH ' + (blank(r.prep_naoh_flake_kg) ? '–' : r.prep_naoh_flake_kg) + ' kg') + tag('HF ' + (blank(r.prep_hidroflok_kg) ? '–' : r.prep_hidroflok_kg) + ' kg');
    (FIK_TIMES[parseInt(r.shift, 10)] || []).forEach(function(w) { if (!blank(r['p' + w + '_ph'])) h += tag(w + ':00 pH ' + r['p' + w + '_ph']); });
    if (r.prep_pompa_ok === false || r.prep_tangki_ok === false) h += tag('alat abnormal', 'bad');
    return h;
  }
  if (mod === 'sft') return isTrue(r.regenerasi) ? tag('regenerasi', 'on') + tag('garam ' + (blank(r.garam_kg) ? '–' : r.garam_kg) + ' kg') : tag('tanpa regenerasi', 'off');
  if (mod === 'mnt') {
    var c = { clr: [0, 0], sft: [0, 0] };
    eachField('mnt', 1, function(f) { if (f.t !== 'ck') return; var g = f.k.indexOf('mnt_clr') === 0 ? 'clr' : 'sft'; c[g][1]++; if (isTrue(r[f.k])) c[g][0]++; });
    return tag('Clarifier ' + c.clr[0] + '/' + c.clr[1] + ' OK', c.clr[0] === c.clr[1] ? 'on' : 'warn') + tag('Softener ' + c.sft[0] + '/' + c.sft[1] + ' OK', c.sft[0] === c.sft[1] ? 'on' : 'warn');
  }
  if (mod === 'pg') {
    return PG_SUMUR.map(function(n) {
      var p = r['pg_sm' + n + '_pressure'], k = r['pg_sm' + n + '_kondisi'];
      return tag('Sm' + n + ' ' + (k === 'Pompa Mati' ? 'off' : (blank(p) ? '–' : p)), k === 'Abnormal' ? 'bad' : (k === 'Pompa Mati' ? 'off' : ''));
    }).join('');
  }
  return '';
}

function renderPager(page, totalPages, total) {
  var el = $('pager');
  if (totalPages <= 1) { el.innerHTML = '<span class="info">' + total + ' record</span>'; return; }
  var h = '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="loadData(' + (page - 1) + ')" aria-label="Sebelumnya">←</button>';
  for (var i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) h += '<button class="' + (i === page ? 'active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
  h += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="loadData(' + (page + 1) + ')" aria-label="Berikutnya">→</button><span class="info">' + total + ' record</span>';
  el.innerHTML = h;
}

// ========== DETAIL / EDIT / DELETE ==========
function detailValue(f, v) {
  if (f.t === 'ck' || f.t === 'tog') return isTrue(v) ? '<span class="yes">✓ Ya</span>' : '<span class="no">✗ Tidak</span>';
  if (f.t === 'num') return fmtNum(v, unitOf(f));
  if (f.t === 'date') return blank(v) ? '–' : esc(fmtD(v));
  return blank(v) ? '–' : esc(v);
}

function openDetail(id) {
  var r = S.dataRecs[id]; if (!r) return;
  var mod = S.dataMod, shift = parseInt(r.shift, 10) || 1;
  var h = '<div class="pad">';
  if (r._pending) h += '<div class="notice warn" style="margin:0 0 6px">Ada request <b>' + (r._pending.type === 'edit' ? 'ubah' : 'hapus') + '</b> menunggu approval (' + esc(r._pending.request_id) + ').</div>';
  h += '<div class="dsec"><span class="slug">informasi/</span>' +
    '<div class="drow"><span>Tanggal</span><span>' + esc(fmtD(r.tanggal)) + '</span></div>' +
    '<div class="drow"><span>Shift</span><span>' + esc(r.shift) + ' · ' + (SHIFT_HOURS[shift] || '') + '</span></div>' +
    '<div class="drow"><span>Operator</span><span>' + esc(r.nama_operator || '–') + '</span></div>' +
    '<div class="drow"><span>Diinput</span><span>' + esc(fmtDT(r.timestamp)) + '</span></div>' +
    '<div class="drow"><span>Record ID</span><span class="mono">' + esc(r.record_id) + '</span></div></div>';
  var cur = null, rows = '';
  var flush = function() { if (cur) h += '<div class="dsec"><span class="slug">' + esc(slug(cur.t)) + '</span>' + rows + '</div>'; rows = ''; };
  eachField(mod, shift, function(f, sec) {
    if (sec !== cur) { flush(); cur = sec; }
    if (f.t === 'area') { rows += blank(r[f.k]) ? '<div class="drow"><span>' + esc(f.l) + '</span><span>–</span></div>' : '<div class="dtext">' + esc(r[f.k]) + '</div>'; return; }
    if (f.showIf && !isTrue(r[f.showIf])) return;
    rows += '<div class="drow"><span>' + esc(f.l) + '</span><span>' + detailValue(f, r[f.k]) + '</span></div>';
  });
  flush();
  if (mod === 'ops') {
    h += '<div class="dsec"><span class="slug">selisih-clarifier/</span>' + CLR_ROWS.map(function(c) {
      var b = parseFloat(r['clr_' + c[0] + '_before']) || 0, a = parseFloat(r['clr_' + c[0] + '_after']) || 0, d = Math.round((a - b) * 100) / 100;
      return '<div class="drow"><span>' + esc(c[1]) + '</span><span class="' + (d < 0 && a > 0 ? 'mono" style="color:var(--danger)' : 'mono') + '">' + (d > 0 ? '+' : '') + d + '</span></div>';
    }).join('') + '</div>';
  }
  h += '</div>';
  var foot = '<button class="btn-line" onclick="closeSheet()">tutup/</button>';
  if (!isVisitor()) foot = '<button class="btn-line" onclick="openDelete(\'' + jsId(id) + '\')">ajukan hapus/</button><button class="btn-go" onclick="openEdit(\'' + jsId(id) + '\')"><span>Ajukan Ubah</span><span class="arr">↗</span></button>';
  openSheet(MODS[mod].title + ' · ' + fmtD(r.tanggal) + ' · S' + r.shift, h, foot);
}

function pendingNotice(r) {
  return r._pending ? '<div class="notice warn">Request <b>' + (r._pending.type === 'edit' ? 'ubah' : 'hapus') + '</b> sebelumnya (' + esc(r._pending.request_id) + ') akan <b>otomatis digantikan</b> oleh request ini.</div>' : '';
}

function openEdit(id) {
  var r = S.dataRecs[id]; if (!r) return;
  var mod = S.dataMod, shift = parseInt(r.shift, 10) || 1;
  S.edit = { mod: mod, id: id, shift: shift, rec: r };
  var h = pendingNotice(r) + '<div class="meta">' +
    '<div class="meta-cell"><span class="slug">tanggal/</span><input type="date" id="e_tanggal" value="' + esc(r.tanggal) + '"></div>' +
    '<div class="meta-cell"><span class="slug">shift/</span><div class="seg seg-wide" id="e_shift">' + [1, 2, 3].map(function(s) { return '<button type="button" data-v="' + s + '" class="' + (s === shift ? 'active' : '') + '" onclick="editShift(' + s + ')">Shift ' + s + '</button>'; }).join('') + '</div></div>' +
    '<div class="meta-cell"><span class="slug">operator/</span><div class="meta-val">' + esc(r.nama_operator || '–') + '</div><span class="hint">tidak berubah</span></div></div>' +
    renderForm(mod, r, shift, 'e_');
  openSheet('Ubah ' + MODS[mod].title, h, '<button class="btn-line" onclick="closeSheet()">batal/</button><button class="btn-go" onclick="submitEdit()"><span>Kirim Request</span><span class="arr">↗</span></button>');
  afterRender(mod, 'e_');
}
function editShift(s) {
  S.edit.shift = s;
  document.querySelectorAll('#e_shift button').forEach(function(b) { b.classList.toggle('active', parseInt(b.getAttribute('data-v'), 10) === s); });
  if (S.edit.mod === 'fik' && $('e_fikSlots')) $('e_fikSlots').innerHTML = fikSlotsHtml(S.edit.rec, s, 'e_');
}

function changed(oldV, newV) {
  if (typeof newV === 'boolean') return isTrue(oldV) !== newV;
  if (typeof newV === 'number') return parseFloat(oldV) !== newV;
  return String(blank(oldV) ? '' : oldV).trim() !== String(newV).trim();
}

function submitEdit() {
  var e = S.edit; if (!e) return;
  var data = collect(e.mod, 'e_', e.shift);
  data.tanggal = $('e_tanggal').value; data.shift = e.shift;
  if (!data.tanggal) { toast('Tanggal harus diisi!', 'error'); return; }
  var diff = {};
  Object.keys(data).forEach(function(k) { if (changed(e.rec[k], data[k])) diff[k] = data[k]; });
  if (!Object.keys(diff).length) { toast('Tidak ada perubahan.', 'error'); return; }
  loading(true);
  callAuth('createRequest', [{ type: 'edit', module: e.mod, recordId: e.id, editData: diff }], function(res) {
    loading(false);
    if (res && res.success) { closeSheet(); toast(res.message, 'success'); loadData(S.dataPage); loadBadges(); }
    else toast((res && res.message) || 'Gagal mengirim request.', 'error');
  });
}

function openDelete(id) {
  var r = S.dataRecs[id]; if (!r) return;
  var mod = S.dataMod;
  confirmDlg('Ajukan penghapusan?', '<div class="pad">' + pendingNotice(r).replace('class="notice warn"', 'class="notice warn" style="margin:0 0 12px"') +
    '<div class="dsec"><div class="drow"><span>Modul</span><span>' + esc(MODS[mod].title) + '</span></div><div class="drow"><span>Tanggal</span><span>' + esc(fmtD(r.tanggal)) + ' · Shift ' + esc(r.shift) + '</span></div><div class="drow"><span>Operator</span><span>' + esc(r.nama_operator || '–') + '</span></div></div>' +
    '<p style="margin-top:10px">Data baru terhapus setelah disetujui approver.</p></div>', 'Kirim Request Hapus', function() {
    loading(true);
    callAuth('createRequest', [{ type: 'delete', module: mod, recordId: id }], function(res) {
      loading(false);
      if (res && res.success) { closeSheet(); toast(res.message, 'success'); loadData(S.dataPage); loadBadges(); }
      else toast((res && res.message) || 'Gagal mengirim request.', 'error');
    });
  }, { danger: true });
}

// ========== REQUEST PAGE ==========
var REQ_STATUS = { pending: 'menunggu', approved: 'disetujui', rejected: 'ditolak', superseded: 'digantikan' };
function setReqFilter(v) { S.reqFilter = v; loadRequests(); }
function loadRequests() {
  document.querySelectorAll('#reqSeg button').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-v') === S.reqFilter); });
  $('reqList').innerHTML = '<div class="loading-row"><div class="spin dark"></div></div>';
  callAuth('getRequests', [{ status: S.reqFilter === 'pending' ? 'pending' : '' }], function(res) {
    if (!res || !res.success) { $('reqList').innerHTML = '<div class="empty">' + esc((res && res.message) || 'Gagal memuat.') + '</div>'; return; }
    setBadge('req', res.pendingCount || 0);
    $('reqNote').innerHTML = (res.isApprover ? '<b>Anda approver.</b> ' : '') + 'Perubahan &amp; penghapusan data harus disetujui approver. Request baru pada data yang sama otomatis menggantikan request sebelumnya.';
    S.reqCache = res.requests || [];
    if (!S.reqCache.length) { $('reqList').innerHTML = '<div class="empty">' + (S.reqFilter === 'pending' ? 'tidak ada request menunggu/' : 'belum ada request/') + '</div>'; return; }
    $('reqList').innerHTML = S.reqCache.map(function(r, i) { return reqCard(r, i, res.isApprover); }).join('');
  });
}
function changesTable(ch) {
  if (!ch || !ch.length) return '';
  return '<table class="changes"><thead><tr><th>field/</th><th>lama/</th><th>baru/</th></tr></thead><tbody>' + ch.map(function(c) {
    var f = function(v) { return v === true ? 'Ya' : v === false ? 'Tidak' : (blank(v) ? '–' : v); };
    return '<tr><td>' + esc(c.label) + '</td><td class="from">' + esc(f(c.from)) + '</td><td class="to">' + esc(f(c.to)) + '</td></tr>';
  }).join('') + '</tbody></table>';
}
function reqCard(r, i, isApprover) {
  var h = '<div class="card"><div class="card-h"><div class="card-t">' + (r.type === 'edit' ? 'Ubah' : 'Hapus') + ' · ' + esc(r.module_title || r.module) + '<small>' + esc(r.request_id) + '</small></div>' +
    '<span class="status st-' + esc(r.status) + '">' + esc(REQ_STATUS[r.status] || r.status) + '</span></div><dl class="kv">' +
    '<dt>record</dt><dd>' + esc(r.record_info) + '</dd><dt>pengaju</dt><dd>' + esc(r.requester_name) + '</dd><dt>waktu</dt><dd>' + esc(fmtDT(r.timestamp)) + '</dd>';
  if (r.status !== 'pending') {
    h += '<dt>oleh</dt><dd>' + esc(r.approver === 'SYSTEM' ? 'otomatis' : r.approver) + ' · ' + esc(fmtDT(r.resolved_at)) + '</dd>';
    if (r.reason) h += '<dt>' + (r.status === 'superseded' ? 'keterangan' : 'alasan') + '</dt><dd>' + esc(r.reason) + '</dd>';
  }
  h += '</dl>' + changesTable(r.changes);
  if (isApprover && r.status === 'pending') {
    h += '<div class="card-actions"><button class="btn-line" onclick="rejectReq(' + i + ')">tolak/</button><button class="btn-go" onclick="approveReq(' + i + ')"><span>Setujui</span><span class="arr">↗</span></button></div>';
  }
  return h + '</div>';
}
function approveReq(i) {
  var r = S.reqCache[i]; if (!r) return;
  confirmDlg('Setujui request?', '<div class="pad"><p class="slug" style="margin-bottom:8px">' + esc(r.request_id) + '</p><p><b>' + (r.type === 'edit' ? 'Ubah' : 'Hapus') + '</b> — ' + esc(r.record_info) + '</p>' + changesTable(r.changes) +
    (r.type === 'delete' ? '<div class="notice bad" style="margin:12px 0 0">Data akan dihapus permanen dari sheet.</div>' : '') + '</div>', 'Setujui', function() {
    resolveReq(r.request_id, 'approved', '');
  }, { danger: r.type === 'delete' });
}
function rejectReq(i) {
  var r = S.reqCache[i]; if (!r) return;
  promptDlg('Tolak request', 'Alasan penolakan (opsional)', 'Tolak', function(reason) { resolveReq(r.request_id, 'rejected', reason); });
}
function resolveReq(id, action, reason) {
  loading(true);
  callAuth('resolveRequest', [id, action, reason || ''], function(res) {
    loading(false);
    if (res && res.success) { closeSheet(); toast(res.message, 'success'); loadRequests(); }
    else toast((res && res.message) || 'Gagal.', 'error');
  });
}

// ========== ANOMALI PAGE ==========
function setNtfFilter(v) { S.ntfFilter = v; renderNotifs(); }
function loadNotifs() {
  $('ntfList').innerHTML = '<div class="loading-row"><div class="spin dark"></div></div>';
  callAuth('getNotifications', [{}], function(res) {
    if (!res || !res.success) { $('ntfList').innerHTML = '<div class="empty">' + esc((res && res.message) || 'Gagal memuat.') + '</div>'; return; }
    setBadge('ntf', res.unreadCount || 0);
    S.ntfCache = res.notifications || []; S.ntfApprover = res.isApprover;
    renderNotifs();
  });
}
function renderNotifs() {
  document.querySelectorAll('#ntfSeg button').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-v') === S.ntfFilter); });
  var list = S.ntfCache.filter(function(n) { return S.ntfFilter === 'all' || n.status === 'unread'; });
  if (!list.length) { $('ntfList').innerHTML = '<div class="empty">' + (S.ntfFilter === 'all' ? 'belum ada anomali/' : 'semua anomali sudah ditinjau/') + '</div>'; return; }
  $('ntfList').innerHTML = list.map(function(n) {
    var unread = n.status === 'unread';
    var h = '<div class="card' + (unread ? ' unread' : '') + '"><div class="card-h"><div class="card-t">Selisih negatif · ' + esc(n.field) + '<small>' + esc(n.notif_id) + '</small></div>' +
      '<span class="status ' + (unread ? 'st-pending' : 'st-resolved') + '">' + (unread ? 'belum ditinjau' : 'resolved') + '</span></div><dl class="kv">' +
      '<dt>tanggal</dt><dd>' + esc(fmtD(n.tanggal)) + ' · Shift ' + esc(n.shift) + '</dd><dt>operator</dt><dd>' + esc(n.operator_name) + '</dd>' +
      '<dt>nilai</dt><dd class="mono">' + esc(n.before_val) + ' → ' + esc(n.after_val) + ' <b style="color:var(--danger)">(' + esc(n.diff) + ')</b></dd>';
    if (n.resolved_by) h += '<dt>ditinjau</dt><dd>' + esc(n.resolved_by) + '</dd>';
    if (n.notes) h += '<dt>catatan</dt><dd>' + esc(n.notes) + '</dd>';
    h += '</dl>';
    if (S.ntfApprover && unread) h += '<div class="card-actions"><button class="btn-go" onclick="resolveNtf(\'' + jsId(n.notif_id) + '\')"><span>Tandai Resolved</span><span class="arr">↗</span></button></div>';
    return h + '</div>';
  }).join('');
}
function resolveNtf(id) {
  promptDlg('Tandai resolved', 'Catatan tindak lanjut (opsional)', 'Simpan', function(notes) {
    loading(true);
    callAuth('resolveNotification', [id, notes], function(res) {
      loading(false);
      if (res && res.success) { closeSheet(); toast(res.message, 'success'); loadNotifs(); }
      else toast((res && res.message) || 'Gagal.', 'error');
    });
  });
}

// ========== LAPORAN ==========
function segPick(btn) { btn.parentElement.querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b === btn); }); }
function segVal(id) { var a = document.querySelector('#' + id + ' button.active'); return a ? a.getAttribute('data-v') : ''; }
function initReport() {
  if (S.reportInit) return;
  S.reportInit = true;
  $('rEnd').value = S.info.today; $('rStart').value = addDays(S.info.today, -30);
}
function runReport() {
  var s = $('rStart').value, e = $('rEnd').value;
  if (!s || !e) { toast('Tentukan tanggal!', 'error'); return; }
  if (s > e) { toast('Tanggal mulai harus sebelum tanggal akhir.', 'error'); return; }
  var fmt = segVal('rFormat'), mode = segVal('rMode'), st = $('rStatus');
  var label = { sheet: 'sheet', xlsx: 'Excel', csv: 'CSV', pdf: 'PDF' }[fmt];
  st.innerHTML = '<div class="notice"><div class="spin dark" style="display:inline-block;vertical-align:middle;margin-right:10px"></div>Membuat ' + label + '…</div>';
  var fail = function(msg) { st.innerHTML = '<div class="notice bad">' + esc(msg) + '</div>'; };
  if (fmt === 'sheet') {
    callAuth('generateReport', [{ startDate: s, endDate: e, mode: mode }], function(res) {
      if (res && res.success) { st.innerHTML = '<div class="notice"><b>Sheet berhasil dibuat.</b> Buka spreadsheet, cari tab <b class="mono">' + esc(res.sheetName) + '</b>.</div>'; toast('Sheet ' + res.sheetName + ' dibuat.', 'success'); }
      else fail((res && res.message) || 'Gagal.');
    }, function(err) { fail('Gagal: ' + (err && err.message ? err.message : 'koneksi error')); });
    return;
  }
  callAuth('exportReportFile', [{ startDate: s, endDate: e, format: fmt, mode: mode }], function(res) {
    if (res && res.success) { downloadBase64File(res.data, res.filename, res.mimeType); st.innerHTML = '<div class="notice"><b>Download berhasil.</b> File: <b class="mono">' + esc(res.filename) + '</b></div>'; toast(label + ' berhasil di-download.', 'success'); }
    else fail((res && res.message) || 'Gagal.');
  }, function(err) { fail('Gagal: ' + (err && err.message ? err.message : 'koneksi error')); });
}
function downloadBase64File(base64, filename, mimeType) {
  var raw = atob(base64), arr = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([arr], { type: mimeType }));
  var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

// ========== SHEET / DIALOG ==========
function openSheet(title, body, foot) {
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  $('sheetFoot').innerHTML = foot || '';
  $('sheetBody').scrollTop = 0;
  $('sheet').classList.add('open');
  document.body.classList.add('noscroll');
}
function closeSheet() {
  $('sheet').classList.remove('open');
  document.body.classList.remove('noscroll');
  S.dlgOk = null;
}
function confirmDlg(title, html, okLabel, onOk, opts) {
  opts = opts || {};
  openSheet(title, html, '<button class="btn-line" onclick="closeSheet()">batal/</button><button class="btn-go' + (opts.danger ? ' btn-danger' : '') + '" onclick="dlgOk()"><span>' + esc(okLabel) + '</span><span class="arr">↗</span></button>');
  S.dlgOk = function() { onOk(); };
}
function promptDlg(title, label, okLabel, onOk) {
  openSheet(title, '<div class="pad"><div class="fld"><label for="dlg_text">' + esc(label) + '</label><textarea id="dlg_text" rows="3"></textarea></div></div>',
    '<button class="btn-line" onclick="closeSheet()">batal/</button><button class="btn-go" onclick="dlgOk()"><span>' + esc(okLabel) + '</span><span class="arr">↗</span></button>');
  S.dlgOk = function() { onOk(($('dlg_text').value || '').trim()); };
  setTimeout(function() { var t = $('dlg_text'); if (t) t.focus(); }, 50);
}
function dlgOk() { var fn = S.dlgOk; if (fn) fn(); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet(); });

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function() {
  applyThemeUi();
  setServerInfo(S.info);
  tickClock(); setInterval(tickClock, 1000);
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('wwtp_sess') || 'null'); } catch (e) {}
  if (saved && saved.token && saved.user) { S.token = saved.token; S.user = saved.user; enterApp(); }
  else showLogin('');
});
</script>
